<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasabi Orbital Social Club Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Elite Dangerous Color Palette */
        :root {
            --ed-orange: #ff7100;
            --ed-orange-dim: rgba(255, 113, 0, 0.15);
            --ed-orange-glow: rgba(255, 113, 0, 0.4);
            --ed-cyan: #00e5ff;
            --ed-cyan-dim: rgba(0, 229, 255, 0.1);
            --bg-dark: #050505;
            --panel-bg: rgba(10, 8, 5, 0.85);
            --text-light: #f4f4f4;
            --danger: #ff3333;
            --success: #00ff44;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--ed-orange);
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
            background-image: radial-gradient(circle at center, #110d0a 0%, #000000 100%);
        }

        /* Subtle CRT Scanlines */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.08) 50%);
            background-size: 100% 4px; z-index: 100; pointer-events: none;
        }

        .container { max-width: 1100px; width: 100%; z-index: 1; }

        /* Top Header */
        .header {
            border-bottom: 2px solid var(--ed-orange); margin-bottom: 2rem; padding-bottom: 1rem;
            display: flex; justify-content: space-between; align-items: flex-end;
            box-shadow: 0 4px 10px -4px var(--ed-orange-glow);
        }
        .header h1 { font-size: 2.2rem; letter-spacing: 2px; text-shadow: 0 0 8px var(--ed-orange-glow); color: var(--ed-orange); }
        .header-sub { color: var(--ed-cyan); font-weight: 600; letter-spacing: 1px; text-shadow: 0 0 5px var(--ed-cyan-dim); }

        /* Dashboard Grid */
        .dashboard { display: grid; grid-template-columns: 1.3fr 1fr; gap: 2rem; align-items: start; }
        .dashboard-col { display: flex; flex-direction: column; gap: 2rem; }
        @media (max-width: 900px) { .dashboard { grid-template-columns: 1fr; } }

        /* Panels */
        .panel {
            background: var(--panel-bg); border: 1px solid var(--ed-orange);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5), inset 0 0 20px var(--ed-orange-dim);
            position: relative; display: flex; flex-direction: column; height: 100%;
        }
        .panel::before, .panel::after { content: ''; position: absolute; width: 10px; height: 10px; border: 2px solid var(--ed-cyan); }
        .panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .panel-header {
            background: var(--ed-orange-dim); padding: 0.75rem 1.5rem;
            border-bottom: 1px solid var(--ed-orange); display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; user-select: none;
        }
        .panel-header h2 { font-size: 1.3rem; letter-spacing: 2px; color: var(--ed-cyan); text-shadow: 0 0 5px var(--ed-cyan-dim); }
        .panel-content { padding: 1.5rem; flex-grow: 1; }
        .panel.collapsed .panel-content { display: none; }
        .panel-chevron { color: var(--ed-cyan); font-size: 0.8rem; margin-left: 10px; transition: transform 0.25s; opacity: 0.6; display: inline-block; }
        .panel.collapsed .panel-chevron { transform: rotate(-90deg); }

        /* System Navigation */
        .sys-nav {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--ed-orange);
        }
        .sys-nav button {
            background: rgba(0, 229, 255, 0.05); border: 1px solid var(--ed-cyan); color: var(--ed-cyan);
            font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 1rem; padding: 4px 12px;
            cursor: pointer; text-transform: uppercase; transition: all 0.2s;
        }
        .sys-nav button:hover { background: var(--ed-cyan-dim); box-shadow: 0 0 8px var(--ed-cyan-dim); color: #fff; }

        .sys-name-container { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .sys-name { font-size: 1.5rem; color: var(--text-light); font-weight: 700; text-align: center; line-height: 1.1; }
        .sys-subtitle { font-size: 0.85rem; color: var(--ed-cyan); opacity: 0.8; letter-spacing: 1px; }

        /* Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 1rem; border-bottom: 1px dashed var(--ed-orange-dim); padding-bottom: 10px; flex-wrap: wrap; }
        .tab-btn {
            background: transparent; border: 1px solid transparent; color: var(--ed-orange);
            font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; font-weight: 600; cursor: pointer;
            padding: 5px 10px; opacity: 0.6; transition: all 0.2s; text-transform: uppercase;
        }
        .tab-btn:hover { opacity: 1; border-bottom: 1px solid var(--ed-orange); }
        .tab-btn.active { opacity: 1; color: var(--ed-cyan); border-bottom: 2px solid var(--ed-cyan); text-shadow: 0 0 5px var(--ed-cyan-dim); }

        .tab-pane { display: none; max-height: 55vh; overflow-y: auto; padding-right: 5px; }
        .tab-pane.active { display: block; }

        .tab-pane::-webkit-scrollbar { width: 4px; }
        .tab-pane::-webkit-scrollbar-track { background: #111; }
        .tab-pane::-webkit-scrollbar-thumb { background: var(--ed-cyan); }

        /* Factions */
        .faction-item { background: rgba(0, 0, 0, 0.4); border: 1px solid var(--ed-orange-dim); padding: 10px; margin-bottom: 10px; cursor: pointer; transition: background 0.2s; }
        .faction-item:hover { background: rgba(0, 229, 255, 0.05); }
        .faction-name { color: var(--ed-cyan); font-weight: 600; font-size: 1.1rem; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .faction-state { font-size: 0.85rem; color: var(--text-light); opacity: 0.8; }
        .inf-bar-bg { width: 100%; height: 4px; background: #111; margin-top: 8px; }
        .inf-bar-fill { height: 100%; background: var(--ed-orange); transition: width 1s ease-out; }

        /* Stellar Bodies */
        .body-item { margin-bottom: 6px; }
        .body-header {
            padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.4); border-left: 3px solid var(--ed-orange);
            cursor: pointer; transition: background 0.2s; border-bottom: 1px solid var(--ed-orange-dim);
        }
        .body-header:hover { background: rgba(255, 113, 0, 0.15); }
        .body-name { color: var(--text-light); font-weight: 600; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
        .body-type { color: var(--ed-orange); font-size: 0.8rem; opacity: 0.9; text-transform: uppercase; }
        .body-dist { color: var(--ed-cyan); font-size: 0.85rem; font-weight: 600; }
        .body-landable { padding: 1px 5px; border: 1px solid var(--ed-cyan); color: var(--ed-cyan); font-size: 0.7rem; border-radius: 2px; }

        .body-details {
            display: none; padding: 12px; background: rgba(0,0,0,0.6);
            border-left: 3px dashed var(--ed-orange-dim); font-size: 0.9rem; color: var(--text-light);
        }
        .body-details.active { display: block; }
        .body-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
        .body-stat { display: flex; flex-direction: column; }
        .body-stat-label { font-size: 0.75rem; color: var(--ed-cyan); opacity: 0.8; font-weight: 600; }
        .body-stat-val { font-size: 0.95rem; }

        .body-children {
            margin-left: 20px; border-left: 1px dashed var(--ed-cyan-dim);
            padding-left: 10px; margin-top: 6px; display: flex; flex-direction: column;
        }

        /* Installations */
        .location-item {
            background: rgba(0, 0, 0, 0.4); border: 1px solid var(--ed-cyan-dim); border-left: 3px solid var(--ed-cyan);
            margin-bottom: 8px; transition: all 0.2s;
        }
        .loc-header {
            padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .loc-header:hover { background: rgba(0, 229, 255, 0.05); }
        .loc-details { display: flex; flex-direction: column; }
        .loc-name { color: var(--text-light); font-weight: 600; font-size: 1.1rem; }
        .loc-type { color: var(--ed-cyan); font-size: 0.85rem; opacity: 0.8; }
        .loc-dist { color: var(--ed-orange); font-size: 0.9rem; font-weight: 600; }

        .loc-body {
            display: none; padding: 12px; border-top: 1px dashed var(--ed-cyan-dim); background: rgba(0,0,0,0.6); font-size: 0.9rem;
        }
        .loc-body.active { display: block; }

        .service-tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
        .tag { background: #1a1a1a; border: 1px solid var(--ed-cyan-dim); color: var(--ed-cyan); padding: 2px 6px; font-size: 0.8rem; }

        .market-grid {
            display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 5px; margin-top: 10px;
            border: 1px solid var(--ed-orange-dim); padding: 5px; background: #0a0a0a;
        }
        .market-header { color: var(--ed-orange); font-weight: 600; border-bottom: 1px solid #333; padding-bottom: 3px; font-size: 0.8rem; }
        .market-row { color: var(--text-light); font-size: 0.85rem; padding: 2px 0; border-bottom: 1px solid #1a1a1a; }
        .market-row:last-child { border-bottom: none; }
        .market-supply { color: var(--ed-cyan); text-align: right; }
        .market-demand { color: var(--danger); text-align: right; }

        /* Operation Cards */
        .op-card {
            border-left: 3px solid var(--ed-cyan);
            background: rgba(0, 229, 255, 0.05);
            padding: 1rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        /* Operation Type Color Coding */
        .op-card.type-combat    { border-left-color: var(--danger);  background: rgba(255, 51, 51, 0.05); }
        .op-card.type-logistics { border-left-color: var(--success); background: rgba(0, 255, 68, 0.05); }
        .op-card.type-science   { border-left-color: var(--ed-cyan); background: rgba(0, 229, 255, 0.05); }
        .op-card.type-criminal  { border-left-color: #b026ff;        background: rgba(176, 38, 255, 0.05); }
        .op-card.type-bgs       { border-left-color: var(--ed-orange); background: var(--ed-orange-dim); }
        .op-card.type-other     { border-left-color: #888888;        background: rgba(136, 136, 136, 0.05); }

        .op-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; align-items: flex-start; gap: 8px; }
        .op-title { color: var(--text-light); font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .op-type-tag { font-size: 0.75rem; padding: 2px 6px; border: 1px solid currentColor; opacity: 0.9; font-weight: bold; letter-spacing: 1px; white-space: nowrap; }

        .op-status { padding: 2px 8px; font-weight: bold; font-size: 0.8rem; color: #000; white-space: nowrap; flex-shrink: 0; }

        .op-desc { color: var(--text-light); font-size: 0.92rem; line-height: 1.45; text-transform: none; opacity: 0.9; }

        /* Metadata Footer */
        .op-meta {
            display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.12); font-size: 0.82rem;
        }
        .op-meta-item { color: var(--text-light); display: flex; gap: 5px; opacity: 0.8; }
        .op-meta-label { font-weight: 600; }

        /* Match meta labels to card type */
        .type-combat    .op-meta-label { color: var(--danger); }
        .type-logistics .op-meta-label { color: var(--success); }
        .type-science   .op-meta-label { color: var(--ed-cyan); }
        .type-criminal  .op-meta-label { color: #b026ff; }
        .type-bgs       .op-meta-label { color: var(--ed-orange); }
        .type-other     .op-meta-label { color: #888888; }

        /* Operation Progress Bars */
        .op-progress-container {
            margin-top: 15px; padding-top: 10px; border-top: 1px dashed rgba(255, 255, 255, 0.12);
        }
        .op-progress-header {
            display: flex; justify-content: space-between; font-size: 0.82rem;
            margin-bottom: 5px; color: var(--text-light); font-weight: 600;
        }
        .op-progress-bar-bg {
            width: 100%; height: 6px; background: #111;
            border: 1px solid var(--ed-cyan-dim); position: relative; overflow: hidden;
        }
        .op-progress-bar-fill {
            height: 100%; transition: width 1.5s cubic-bezier(0.1, 0.7, 0.1, 1);
        }

        /* Event Cards */
        .event-card {
            border-left: 3px solid var(--ed-orange);
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            margin-bottom: 1rem;
            transition: background 0.2s ease;
        }
        .event-card:hover { background: rgba(255, 113, 0, 0.08); }

        .event-date-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.88rem; margin-bottom: 0.75rem;
            border-bottom: 1px dashed var(--ed-orange-dim); padding-bottom: 6px; flex-wrap: wrap; gap: 6px;
        }
        .event-gst   { color: var(--ed-orange); font-weight: 700; letter-spacing: 1px; }
        .event-local { color: var(--ed-cyan); opacity: 0.8; font-weight: 600; }

        /* Ticker */
        .ticker-wrap {
            display: flex; align-items: center;
            background: rgba(0, 0, 0, 0.6); border: 1px solid var(--ed-orange-dim);
            border-left: 3px solid var(--ed-orange); margin-bottom: 2rem;
            overflow: hidden; height: 45px;
            box-shadow: inset 0 0 15px rgba(255, 113, 0, 0.05);
        }
        .ticker-header {
            background: var(--ed-orange-dim); color: var(--ed-cyan);
            padding: 0 15px; font-weight: 700; height: 100%; display: flex;
            align-items: center; letter-spacing: 2px; border-right: 1px solid var(--ed-orange);
            z-index: 10; text-shadow: 0 0 5px var(--ed-cyan-dim); white-space: nowrap;
        }
        .ticker-content { flex-grow: 1; overflow: hidden; height: 100%; position: relative; }
        .ticker {
            display: inline-flex; align-items: center; height: 100%;
            white-space: nowrap; animation: ticker-crawl 40s linear infinite;
        }
        .ticker-item { display: inline-flex; align-items: center; font-size: 1.05rem; color: var(--text-light); font-weight: 500; }
        .ticker-tag {
            color: var(--ed-orange); border: 1px solid var(--ed-orange);
            padding: 1px 6px; font-size: 0.78rem; margin-right: 10px; font-weight: 700;
        }
        .ticker-separator { color: var(--ed-cyan); opacity: 0.3; margin: 0 2.5rem; font-weight: bold; }

        @keyframes ticker-crawl {
            0%   { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <div class="container">
        <header class="header">
            <div>
                <div id="gst-clock" style="color:var(--text-light);font-weight:600;font-size:1rem;letter-spacing:2px;margin-bottom:5px;opacity:0.9;">SYNCING TIME...</div>
                <h1>WASABI ORBITAL SOCIAL CLUB</h1>
                <div class="header-sub">SQUADRON INTERFACE</div>
            </div>
            <div style="text-align:right;">
                <div class="header-sub" style="color:var(--ed-orange);">Welcome, CMDR!</div>
            </div>
        </header>

        <nav style="display:flex;gap:0;margin-bottom:1.5rem;border:1px solid var(--ed-orange-dim);border-bottom:2px solid var(--ed-orange);background:rgba(0,0,0,0.5);width:fit-content;">
            <a href="index.html" style="display:block;padding:8px 22px;color:var(--ed-cyan);text-decoration:none;font-weight:700;font-size:1rem;letter-spacing:2px;opacity:1;border-right:1px solid var(--ed-orange-dim);text-transform:uppercase;background:rgba(0,229,255,0.07);text-shadow:0 0 6px rgba(0,229,255,0.3);border-bottom:2px solid var(--ed-cyan);margin-bottom:-2px;">&#9632; DASHBOARD</a>
            <a href="neighborhood.html" style="display:block;padding:8px 22px;color:var(--ed-orange);text-decoration:none;font-weight:700;font-size:1rem;letter-spacing:2px;opacity:0.55;border-right:1px solid var(--ed-orange-dim);text-transform:uppercase;transition:all 0.2s;" onmouseover="this.style.opacity='1';this.style.background='var(--ed-orange-dim)'" onmouseout="this.style.opacity='0.55';this.style.background='transparent'">&#9670; LOCAL NEIGHBORHOOD</a>
            <a href="bgs-tools.html" style="display:block;padding:8px 22px;color:var(--ed-orange);text-decoration:none;font-weight:700;font-size:1rem;letter-spacing:2px;opacity:0.55;text-transform:uppercase;transition:all 0.2s;" onmouseover="this.style.opacity='1';this.style.background='var(--ed-orange-dim)'" onmouseout="this.style.opacity='0.55';this.style.background='transparent'">&#9670; BGS TOOLS</a>
        </nav>

        <div class="ticker-wrap">
            <div class="ticker-header">NEWS</div>
            <div class="ticker-content">
                <div class="ticker" id="news-ticker"></div>
            </div>
        </div>

        <main class="dashboard">
            <div class="dashboard-col">
                <section class="panel" id="panel-sysdata">
                    <div class="panel-header" onclick="togglePanel('panel-sysdata')">
                        <h2>SYSTEM DATA</h2>
                        <span>EDSM UPLINK<span class="panel-chevron">&#9660;</span></span>
                    </div>
                    <div class="panel-content">
                        <div id="sys-nav-container"></div>
                        <div class="tabs">
                            <button class="tab-btn" onclick="switchTab('factions')">FACTIONS</button>
                            <button class="tab-btn active" onclick="switchTab('locations')">LOCATIONS</button>
                        </div>
                        <div id="factions-tab" class="tab-pane">
                            <p style="color:var(--ed-cyan);opacity:0.6;font-size:0.9rem;">ESTABLISHING UPLINK...</p>
                        </div>
                        <div id="locations-tab" class="tab-pane active">
                            <p style="color:var(--ed-cyan);opacity:0.6;font-size:0.9rem;">SCANNING LOCAL SPACE...</p>
                        </div>
                    </div>
                </section>
            </div>

            <div class="dashboard-col">
                <section class="panel" id="panel-ops">
                    <div class="panel-header" onclick="togglePanel('panel-ops')">
                        <h2>SQUADRON OPERATIONS</h2>
                        <span>DIRECTIVES<span class="panel-chevron">&#9660;</span></span>
                    </div>
                    <div class="panel-content">
                        <div class="tabs">
                            <button class="tab-btn active" onclick="switchOpTab('ongoing')">ONGOING OPS</button>
                            <button class="tab-btn" onclick="switchOpTab('archived')">ARCHIVED</button>
                        </div>
                        <div id="ongoing-tab" class="tab-pane active">
                            <div id="operations-ongoing-container"></div>
                        </div>
                        <div id="archived-tab" class="tab-pane">
                            <div id="operations-archived-container"></div>
                        </div>
                    </div>
                </section>

                <section class="panel" id="panel-events">
                    <div class="panel-header" onclick="togglePanel('panel-events')">
                        <h2>UPCOMING EVENTS</h2>
                        <span>SQUADRON CALENDAR<span class="panel-chevron">&#9660;</span></span>
                    </div>
                    <div class="panel-content">
                        <div id="events-container">
                            <p style="color:var(--ed-cyan);opacity:0.6;font-size:0.9rem;">SYNCING CALENDAR...</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="data.js"></script>
    <script>
        // ─── CONFIG ──────────────────────────────────────────────────────────
        // COLONIZED_SYSTEMS is defined in data.js
        let currentSystemIndex = 0;

        // ─── GST CLOCK ───────────────────────────────────────────────────────
        function updateGSTClock() {
            const now = new Date();
            const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
            const d  = String(now.getUTCDate()).padStart(2,'0');
            const mo = months[now.getUTCMonth()];
            const y  = now.getUTCFullYear() + 1286;
            const h  = String(now.getUTCHours()).padStart(2,'0');
            const mn = String(now.getUTCMinutes()).padStart(2,'0');
            const s  = String(now.getUTCSeconds()).padStart(2,'0');
            document.getElementById('gst-clock').textContent = `${d} ${mo} ${y} // ${h}:${mn}:${s} GST`;
        }

        // ─── PANELS ──────────────────────────────────────────────────────────
        function togglePanel(id) {
            const panel = document.getElementById(id);
            const collapsed = panel.classList.toggle('collapsed');
            localStorage.setItem('panel-' + id, collapsed ? '1' : '0');
        }

        function restorePanelStates() {
            ['panel-sysdata', 'panel-ops', 'panel-events'].forEach(id => {
                if (localStorage.getItem('panel-' + id) === '1')
                    document.getElementById(id).classList.add('collapsed');
            });
        }

        // ─── TABS ────────────────────────────────────────────────────────────
        function switchTab(name) {
            document.querySelectorAll('#panel-sysdata .tab-btn').forEach(btn =>
                btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${name}'`))
            );
            ['factions','locations'].forEach(t => document.getElementById(t + '-tab').classList.remove('active'));
            document.getElementById(name + '-tab').classList.add('active');
        }

        function switchOpTab(name) {
            document.querySelectorAll('#panel-ops .tab-btn').forEach(btn =>
                btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${name}'`))
            );
            ['ongoing','archived'].forEach(t => document.getElementById(t + '-tab').classList.remove('active'));
            document.getElementById(name + '-tab').classList.add('active');
        }

        // ─── SYSTEM NAV ──────────────────────────────────────────────────────
        function renderSysNav() {
            const sys = COLONIZED_SYSTEMS[currentSystemIndex];
            document.getElementById('sys-nav-container').innerHTML = `
                <div class="sys-nav">
                    <button onclick="changeSystem(-1)">&#9668; PREV</button>
                    <div class="sys-name-container">
                        <div class="sys-name">${sys.nickName}</div>
                        ${sys.realName !== sys.nickName ? `<div class="sys-subtitle">${sys.realName}</div>` : ''}
                    </div>
                    <button onclick="changeSystem(1)">NEXT &#9658;</button>
                </div>`;
        }

        function changeSystem(dir) {
            currentSystemIndex = (currentSystemIndex + dir + COLONIZED_SYSTEMS.length) % COLONIZED_SYSTEMS.length;
            renderSysNav();
            fetchSystemData();
        }

        // ─── EDSM SYSTEM DATA ────────────────────────────────────────────────
        async function fetchSystemData() {
            const sys = COLONIZED_SYSTEMS[currentSystemIndex].realName;
            document.getElementById('factions-tab').innerHTML  = '<p style="color:var(--ed-cyan);opacity:0.6;font-size:0.9rem;letter-spacing:1px;">ESTABLISHING UPLINK...</p>';
            document.getElementById('locations-tab').innerHTML = '<p style="color:var(--ed-cyan);opacity:0.6;font-size:0.9rem;letter-spacing:1px;">SCANNING LOCAL SPACE...</p>';
            try {
                const [fRes, sRes, bRes] = await Promise.all([
                    fetch(`https://www.edsm.net/api-system-v1/factions?systemName=${encodeURIComponent(sys)}&showHistory=0`),
                    fetch(`https://www.edsm.net/api-system-v1/stations?systemName=${encodeURIComponent(sys)}`),
                    fetch(`https://www.edsm.net/api-system-v1/bodies?systemName=${encodeURIComponent(sys)}`),
                ]);
                const fData = await fRes.json();
                const sData = await sRes.json();
                const bData = await bRes.json();
                renderFactions(fData);
                const hasBodies   = bData.bodies?.length   > 0;
                const hasStations = sData.stations?.length > 0;
                if (hasBodies || hasStations) {
                    document.getElementById('locations-tab').innerHTML = renderLocationsTree(bData.bodies || [], sData.stations || [], sys);
                } else {
                    document.getElementById('locations-tab').innerHTML = '<p style="color:var(--ed-orange);opacity:0.4;font-size:0.9rem;">NO LOCATION DATA AVAILABLE</p>';
                }
            } catch(err) {
                const msg = `<p style="color:var(--danger);font-size:0.9rem;">&#9888; UPLINK FAILED: ${err.message}</p>`;
                document.getElementById('factions-tab').innerHTML  = msg;
                document.getElementById('locations-tab').innerHTML = msg;
            }
        }

        function renderFactions(data) {
            const container = document.getElementById('factions-tab');
            if (!data?.factions?.length) {
                container.innerHTML = '<p style="color:var(--ed-orange);opacity:0.4;font-size:0.9rem;">NO FACTION DATA AVAILABLE</p>';
                return;
            }
            const controlling = data.controllingFaction?.name || '';
            const active = data.factions.filter(f => (f.influence || 0) > 0).sort((a,b) => (b.influence||0) - (a.influence||0));
            let html = '';
            if (controlling) html += `<div style="margin-bottom:12px;color:var(--text-light);">CONTROLLING: <span style="color:var(--ed-cyan);">${controlling}</span></div>`;
            html += active.map((f, i) => {
                const inf           = (f.influence * 100).toFixed(1);
                const isCtrl        = f.name === controlling;
                const gov           = f.government  || 'Unknown';
                const allegiance    = f.allegiance  || 'Independent';
                const activeStates  = (f.activeStates  || []).map(s => s.state).join(', ') || 'None';
                const pendingStates = (f.pendingStates || []).map(s => s.state).join(', ') || 'None';
                return `<div class="faction-item" style="${isCtrl ? 'border-color:var(--ed-cyan);' : ''}" onclick="toggleFactionDetail('fd-${i}')">
                    <div class="faction-name"><span>${f.name}</span><span>${inf}%</span></div>
                    <div class="faction-state">STATE: <span style="color:${activeStates === 'None' ? '#888' : 'var(--ed-orange)'}">${activeStates}</span></div>
                    <div class="inf-bar-bg"><div class="inf-bar-fill" style="width:${Math.min(parseFloat(inf),100)}%;${isCtrl ? 'background:var(--ed-cyan);' : ''}"></div></div>
                    <div id="fd-${i}" style="display:none;margin-top:10px;font-size:0.85rem;border-top:1px dashed var(--ed-orange-dim);padding-top:8px;">
                        <div style="color:var(--text-light);margin-bottom:2px;"><span style="color:var(--ed-cyan);opacity:0.8;font-weight:600;font-size:0.75rem;">ALLEGIANCE:</span> ${allegiance}</div>
                        <div style="color:var(--text-light);margin-bottom:2px;"><span style="color:var(--ed-cyan);opacity:0.8;font-weight:600;font-size:0.75rem;">GOVERNMENT:</span> ${gov}</div>
                        <div style="color:var(--text-light);margin-bottom:2px;"><span style="color:var(--ed-orange);opacity:0.8;font-weight:600;font-size:0.75rem;">ACTIVE:</span> ${activeStates}</div>
                        <div style="color:var(--text-light);"><span style="color:#888;font-weight:600;font-size:0.75rem;">PENDING:</span> ${pendingStates}</div>
                    </div>
                </div>`;
            }).join('');
            container.innerHTML = html;
        }

        function toggleFactionDetail(id) {
            const el = document.getElementById(id);
            if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }

        function renderLocationsTree(bodies, stations, targetSystem) {
            const byId = {}, byName = {}, roots = [];
            bodies.forEach(b => {
                b.children = []; b.isStation = false;
                if (b.bodyId !== undefined) byId[b.bodyId] = b;
                if (b.name) byName[b.name.toLowerCase()] = b;
            });
            stations.forEach((s, i) => {
                s.isStation = true; s.stationIndex = i;
                let attached = false;
                if (s.body) {
                    if (s.body.id !== undefined && byId[s.body.id])             { byId[s.body.id].children.push(s); attached = true; }
                    else if (s.body.name && byName[s.body.name.toLowerCase()]) { byName[s.body.name.toLowerCase()].children.push(s); attached = true; }
                }
                if (!attached) roots.push(s);
            });
            bodies.forEach(b => {
                let isRoot = true;
                if (b.parents?.length) {
                    for (const p of b.parents) {
                        const pType = Object.keys(p)[0];
                        if (pType !== 'Null' && byId[p[pType]]) { byId[p[pType]].children.push(b); isRoot = false; break; }
                    }
                }
                if (isRoot) roots.push(b);
            });
            roots.sort((a,b) => (a.distanceToArrival||0) - (b.distanceToArrival||0));
            return roots.map(r => buildLocationHtml(r, targetSystem)).join('');
        }

        function buildLocationHtml(node, targetSystem) {
            if (node.isStation) {
                const dist = node.distanceToArrival ? node.distanceToArrival.toLocaleString() + ' Ls' : 'Unknown';
                let displayType = node.type || 'Unknown Type';
                if (displayType === 'Odyssey Settlement') displayType = 'Planetary Settlement';
                const services = (node.otherServices || []).map(s => `<span class="tag">${s}</span>`).join('');
                const economy  = node.economy ? `<span class="tag" style="color:var(--ed-orange);border-color:var(--ed-orange-dim)">${node.economy}</span>` : '';
                const ctrl     = node.controllingFaction ? `<div style="font-size:0.85rem;margin-bottom:10px;border-bottom:1px dashed #333;padding-bottom:5px;"><span style="color:var(--ed-cyan);opacity:0.8;font-weight:600;">CONTROLLING FACTION:</span> <span style="color:var(--text-light);">${node.controllingFaction.name}</span></div>` : '';
                const safeName = (node.name || '').replace(/'/g, "\\'");
                const idx      = node.stationIndex;
                return `<div class="location-item">
                    <div class="loc-header" onclick="toggleLocation('${targetSystem}','${safeName}',${idx},${!!node.haveMarket})">
                        <div class="loc-details"><span class="loc-name">${node.name}</span><span class="loc-type">${displayType}</span></div>
                        <div style="text-align:right;"><div class="loc-dist">${dist}</div><div style="font-size:0.7rem;color:#666;">CLICK FOR INFO</div></div>
                    </div>
                    <div class="loc-body" id="loc-body-${idx}">
                        ${ctrl}
                        <div style="color:var(--text-light);font-weight:600;margin-bottom:5px;">FACILITIES</div>
                        <div class="service-tags">${economy}${services || '<span style="opacity:0.5;">No explicit services logged.</span>'}</div>
                        <div id="market-data-${idx}" style="margin-top:15px;"></div>
                    </div>
                </div>`;
            }
            node.children.sort((a,b) => {
                if (a.isStation && !b.isStation) return -1;
                if (!a.isStation && b.isStation) return 1;
                return (a.distanceToArrival||0) - (b.distanceToArrival||0);
            });
            const dist     = node.distanceToArrival ? node.distanceToArrival.toLocaleString() + ' Ls' : '0 Ls';
            const landable = node.isLandable ? '<span class="body-landable">LANDABLE</span>' : '';
            const safeId   = node.id || Math.floor(Math.random() * 100000);
            let details = `<div class="body-grid"><div class="body-stat"><span class="body-stat-label">TYPE</span><span class="body-stat-val">${node.subType || node.type || 'Unknown'}</span></div>`;
            if (node.type === 'Star') {
                details += `
                    <div class="body-stat"><span class="body-stat-label">CLASS</span><span class="body-stat-val">${node.spectralClass||'Unknown'}</span></div>
                    <div class="body-stat"><span class="body-stat-label">SURFACE TEMP</span><span class="body-stat-val">${node.surfaceTemperature ? node.surfaceTemperature+' K' : 'Unknown'}</span></div>
                    <div class="body-stat"><span class="body-stat-label">SOLAR MASSES</span><span class="body-stat-val">${node.solarMasses ? node.solarMasses.toFixed(3) : 'Unknown'}</span></div>`;
            } else {
                details += `
                    <div class="body-stat"><span class="body-stat-label">EARTH MASSES</span><span class="body-stat-val">${node.earthMasses ? node.earthMasses.toFixed(4) : 'Unknown'}</span></div>
                    <div class="body-stat"><span class="body-stat-label">GRAVITY</span><span class="body-stat-val">${node.gravity ? node.gravity.toFixed(2)+' G' : 'Unknown'}</span></div>
                    <div class="body-stat"><span class="body-stat-label">SURFACE TEMP</span><span class="body-stat-val">${node.surfaceTemperature ? node.surfaceTemperature+' K' : 'Unknown'}</span></div>`;
                if (node.atmosphereType && node.atmosphereType !== 'No atmosphere')
                    details += `<div class="body-stat"><span class="body-stat-label">ATMOSPHERE</span><span class="body-stat-val">${node.atmosphereType}</span></div>`;
                if (node.volcanismType && node.volcanismType !== 'No volcanism')
                    details += `<div class="body-stat"><span class="body-stat-label">VOLCANISM</span><span class="body-stat-val">${node.volcanismType}</span></div>`;
            }
            details += '</div>';
            if (node.rings?.length) {
                details += `<div style="margin-top:10px;border-top:1px dashed rgba(255,255,255,0.1);padding-top:5px;"><span class="body-stat-label">RINGS</span>`;
                node.rings.forEach(r => { details += `<div style="font-size:0.85rem;color:#ccc;">&#8226; ${r.name} <span style="color:var(--ed-orange);opacity:0.8;">(${r.type})</span></div>`; });
                details += '</div>';
            }
            let html = `<div class="body-item">
                <div class="body-header" onclick="toggleBodyDetail('bd-${safeId}')">
                    <div class="body-name">${node.name} ${landable}</div>
                    <div style="text-align:right;"><div class="body-dist">${dist}</div><div class="body-type">${node.type}</div></div>
                </div>
                <div class="body-details" id="bd-${safeId}">${details}</div>`;
            if (node.children.length)
                html += `<div class="body-children">${node.children.map(c => buildLocationHtml(c, targetSystem)).join('')}</div>`;
            html += '</div>';
            return html;
        }

        function toggleBodyDetail(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('active');
        }

        async function toggleLocation(systemName, stationName, index, hasMarket) {
            const bodyDiv        = document.getElementById(`loc-body-${index}`);
            const marketContainer = document.getElementById(`market-data-${index}`);
            bodyDiv.classList.toggle('active');
            if (!bodyDiv.classList.contains('active') || marketContainer.dataset.loaded) return;
            if (!hasMarket) {
                marketContainer.innerHTML = `<div style="color:#888;font-style:italic;">NO COMMODITIES MARKET AT THIS LOCATION.</div>`;
                marketContainer.dataset.loaded = 'true';
                return;
            }
            marketContainer.innerHTML = `<div style="font-size:0.8rem;padding:5px;color:var(--ed-cyan);">REQUESTING MARKET MANIFEST...</div>`;
            try {
                const res  = await fetch(`https://www.edsm.net/api-system-v1/stations/market?systemName=${encodeURIComponent(systemName)}&stationName=${encodeURIComponent(stationName)}`);
                const data = await res.json();
                if (data?.commodities?.length) {
                    const byDemand = data.commodities.filter(c => c.demand > 0).sort((a,b) => b.demand - a.demand).slice(0,4);
                    const bySupply = data.commodities.filter(c => c.stock  > 0).sort((a,b) => b.stock  - a.stock ).slice(0,4);
                    const combined = Array.from(new Map([...byDemand,...bySupply].map(i => [i.id,i])).values()).slice(0,8);
                    combined.sort((a,b) => a.name.localeCompare(b.name));
                    marketContainer.innerHTML = `
                        <div style="color:var(--text-light);font-weight:600;margin-bottom:5px;display:flex;justify-content:space-between;">
                            <span>MARKET MANIFEST</span><span style="font-size:0.7rem;color:var(--ed-cyan);opacity:0.7;">TOP SUPPLY & DEMAND</span>
                        </div>
                        <div class="market-grid">
                            <div class="market-header">COMMODITY</div>
                            <div class="market-header" style="text-align:right;">SUPPLY</div>
                            <div class="market-header" style="text-align:right;">DEMAND</div>
                            ${combined.map(c => `
                                <div class="market-row" style="color:var(--ed-orange);">${c.name}</div>
                                <div class="market-row market-supply">${c.stock  > 0 ? c.stock.toLocaleString()  : '-'}</div>
                                <div class="market-row market-demand">${c.demand > 0 ? c.demand.toLocaleString() : '-'}</div>`).join('')}
                        </div>`;
                } else {
                    marketContainer.innerHTML = `<div style="color:#888;font-style:italic;">MARKET DATA OUTDATED OR UNAVAILABLE.</div>`;
                }
                marketContainer.dataset.loaded = 'true';
            } catch {
                marketContainer.innerHTML = `<div style="color:var(--danger);font-size:0.85rem;">MARKET UPLINK FAILED.</div>`;
            }
        }

        // ─── OPERATIONS ──────────────────────────────────────────────────────
        const TYPE_COLORS = { combat:'var(--danger)', logistics:'var(--success)', science:'var(--ed-cyan)', criminal:'#b026ff', bgs:'var(--ed-orange)', other:'#888' };

        function renderOperations() {
            const ongoingContainer  = document.getElementById('operations-ongoing-container');
            const archivedContainer = document.getElementById('operations-archived-container');
            ongoingContainer.innerHTML  = '';
            archivedContainer.innerHTML = '';

            const isArchived = op => op.state === 'COMPLETED' || op.archived === true;
            // Preserve original OPERATIONS index so progress div IDs match hydrateOperationProgress
            const sorted = [...OPERATIONS]
                .map((op, i) => [op, i])
                .sort(([a], [b]) => (a.importance||3) - (b.importance||3));

            sorted.forEach(([op, index]) => {
                const type      = (op.type || 'other').toLowerCase();
                const typeColor = TYPE_COLORS[type] || '#888';

                let badgeText  = 'ROUTINE';
                let badgeColor = 'var(--ed-cyan)';
                if      (op.importance === 1) { badgeText = 'CRITICAL'; badgeColor = 'var(--danger)'; }
                else if (op.importance === 2) { badgeText = 'HIGH';     badgeColor = 'var(--ed-orange)'; }
                if (isArchived(op))           { badgeText = 'SECURED';  badgeColor = 'var(--success)'; }

                const metaItems = op.meta || [
                    op.faction  ? { label:'FACTION',  value: op.faction  } : null,
                    op.location ? { label:'LOCATION', value: op.location } : null,
                    op.contact  ? { label:'POC',      value: op.contact  } : null,
                    op.expires  ? { label:'EXPIRES',  value: op.expires  } : null,
                ].filter(Boolean);
                const metaHtml = metaItems.length ? `<div class="op-meta">${metaItems.map(m =>
                    `<div class="op-meta-item"><span class="op-meta-label">${m.label}:</span> ${m.value}</div>`
                ).join('')}</div>` : '';

                const progressHtml = (op.progress && !isArchived(op)) ? `
                    <div id="op-prog-${index}" class="op-progress-container">
                        <div style="font-size:0.8rem;color:var(--ed-cyan);">CALCULATING PROGRESS...</div>
                    </div>` : '';

                const cardHtml = `
                    <div class="op-card type-${type}"${isArchived(op) ? ' style="opacity:0.7;filter:grayscale(40%);"' : ''}>
                        <div class="op-header">
                            <span class="op-title">
                                <span class="op-type-tag" style="color:${typeColor};border-color:${typeColor};">${(op.type||'OTHER').toUpperCase()}</span>
                                ${op.title}
                            </span>
                            <span class="op-status" style="background:${badgeColor};color:#000;">${badgeText}</span>
                        </div>
                        <div class="op-desc">${op.desc}</div>
                        ${metaHtml}
                        ${progressHtml}
                    </div>`;

                if (isArchived(op)) archivedContainer.innerHTML += cardHtml;
                else                ongoingContainer.innerHTML  += cardHtml;
            });

            const empty = msg => `<p style="color:var(--ed-orange);opacity:0.4;font-size:0.9rem;letter-spacing:2px;text-align:center;padding:2rem 0;">${msg}</p>`;
            if (!ongoingContainer.innerHTML)  ongoingContainer.innerHTML  = empty('NO ACTIVE OPERATIONS');
            if (!archivedContainer.innerHTML) archivedContainer.innerHTML = empty('NO ARCHIVED OPERATIONS');

            hydrateOperationProgress();
        }

        async function hydrateOperationProgress() {
            await Promise.all(OPERATIONS.map(async (op, index) => {
                const isArchived = op.state === 'COMPLETED' || op.archived === true;
                if (!op.progress || isArchived) return;
                const container = document.getElementById(`op-prog-${index}`);
                if (!container) return;

                const type       = (op.type || 'other').toLowerCase();
                const themeColor = TYPE_COLORS[type] || 'var(--ed-orange)';
                let currentVal   = op.progress.current ?? null;

                if (op.progress.source === 'edsm_faction') {
                    try {
                        const res  = await fetch(`https://www.edsm.net/api-system-v1/factions?systemName=${encodeURIComponent(op.progress.system)}`);
                        if (!res.ok) throw new Error('Uplink failed');
                        const data    = await res.json();
                        const faction = data.factions?.find(f => f.name === op.progress.faction);
                        if (faction) currentVal = faction.influence * 100;
                        else throw new Error('Faction not in EDSM logs');
                    } catch {
                        container.innerHTML = `<div style="color:var(--danger);font-size:0.85rem;padding-top:10px;">PROGRESS DATA UPLINK FAILED</div>`;
                        return;
                    }
                }
								// Handle manual progress explicitly
								if (op.progress.source === 'manual') {
										currentVal = op.progress.current;
								}
                if (currentVal == null) {
									container.innerHTML = `
											<div style="color:var(--danger);font-size:0.85rem;padding-top:10px;">
													NO PROGRESS DATA
											</div>`;
									return;
								}
                const target = op.progress.target;

                if (typeof op.progress.start === 'number') {
                    // Type A: delta bar (start → target)
                    const start = op.progress.start;
                    let pct = op.progress.lowerIsBetter
                        ? (start - target) === 0 ? 100 : ((start - currentVal) / (start - target)) * 100
                        : (target - start) === 0 ? 100 : ((currentVal - start) / (target - start)) * 100;
                    pct = Math.max(0, Math.min(100, pct));
                    container.innerHTML = `
                        <div class="op-progress-header">
                            <span>CURRENT: ${currentVal.toFixed(1)}${op.progress.unit} / TARGET: ${target}${op.progress.unit}</span>
                            <span>${pct.toFixed(0)}%</span>
                        </div>
                        <div class="op-progress-bar-bg">
                            <div class="op-progress-bar-fill" style="width:${pct}%;background:${themeColor};"></div>
                        </div>`;
                } else {
                    // Type B: threshold sensor widget
                    const isMet           = op.progress.lowerIsBetter ? currentVal <= target : currentVal >= target;
                    const operator        = op.progress.lowerIsBetter ? '≤' : '≥';
                    const statusColor     = isMet ? 'var(--success)' : themeColor;
                    const directionAction = op.progress.lowerIsBetter ? 'REDUCE TO' : 'PUSH TO';
                    const arrowSymbol     = op.progress.lowerIsBetter ? '&#8681;' : '&#8679;';
                    container.innerHTML = `
                        <div class="op-progress-header" style="color:${statusColor};border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:3px;">
                            <span>THRESHOLD SENSOR</span><span>${isMet ? 'CONDITION MET' : 'TRACKING...'}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.5);padding:8px 12px;margin-top:5px;border-left:3px solid ${statusColor};">
                            <div style="font-size:1.1rem;font-weight:700;color:var(--text-light);">
                                <span style="opacity:0.5;font-size:0.75rem;display:block;margin-bottom:-2px;">CURRENT</span>
                                ${currentVal.toFixed(1)}${op.progress.unit}
                            </div>
                            <div style="flex-grow:1;text-align:center;font-size:0.95rem;font-weight:700;color:${statusColor};opacity:0.8;letter-spacing:1px;padding:0 10px;">
                                ${isMet ? '&#10003; SECURED' : `${arrowSymbol} ${directionAction} ${arrowSymbol}`}
                            </div>
                            <div style="font-size:1.1rem;font-weight:700;color:var(--ed-cyan);opacity:0.9;text-align:right;">
                                <span style="opacity:0.5;font-size:0.75rem;display:block;margin-bottom:-2px;">TARGET</span>
                                ${operator} ${target}${op.progress.unit}
                            </div>
                        </div>`;
                }
            }));
        }

        // ─── EVENTS ──────────────────────────────────────────────────────────
        function getEventTypeColor(type) {
            const t = (type || '').toUpperCase();
            if (['PVP','COMBAT','AX','THARGOID','CZ','BOUNTY'].includes(t))              return 'var(--danger)';
            if (['MINING','HAULING','TRADE','RESCUE','LOGISTICS','SALVAGE'].includes(t)) return 'var(--success)';
            if (['RACING','SOCIAL','MEETUP','TRAINING','CQC'].includes(t))               return '#b026ff';
            if (['BGS','ELECTION','WAR','EXPANSION'].includes(t))                        return 'var(--ed-orange)';
            return 'var(--ed-cyan)';
        }

        function renderEvents() {
            const container = document.getElementById('events-container');
            if (!EVENTS.length) {
                container.innerHTML = `<p style="color:var(--ed-orange);opacity:0.4;font-size:0.9rem;letter-spacing:2px;text-align:center;padding:2rem 0;">NO UPCOMING EVENTS SCHEDULED</p>`;
                return;
            }
            const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
            const sorted = [...EVENTS].sort((a,b) => new Date(a.utcTimestamp) - new Date(b.utcTimestamp));
            container.innerHTML = sorted.map(ev => {
                const date  = new Date(ev.utcTimestamp);
                const color = getEventTypeColor(ev.type);
                const gstStr   = `${String(date.getUTCDate()).padStart(2,'0')} ${months[date.getUTCMonth()]} ${date.getUTCFullYear()+1286} // ${String(date.getUTCHours()).padStart(2,'0')}:${String(date.getUTCMinutes()).padStart(2,'0')} GST`;
                const localStr = `${date.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}).toUpperCase()} // ${date.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',timeZoneName:'short'}).toUpperCase()} LOCAL`;
                const metaItems = [
                    ev.location     ? { label:'LOC',   value: ev.location     } : null,
                    ev.requirements ? { label:'REQ',   value: ev.requirements } : null,
                    ev.comms        ? { label:'COMMS', value: ev.comms        } : null,
                    ev.duration     ? { label:'EST',   value: ev.duration     } : null,
                    ev.contact      ? { label:'POC',   value: ev.contact      } : null,
                ].filter(Boolean);
                const metaHtml = metaItems.length ? `<div class="op-meta" style="margin-top:12px;border-top:1px dashed rgba(255,113,0,0.3);">${metaItems.map(m =>
                    `<div class="op-meta-item"><span class="op-meta-label">${m.label}:</span> ${m.value}</div>`
                ).join('')}</div>` : '';
                return `<div class="event-card" style="border-left-color:${color};background:rgba(255,113,0,0.05);">
                    <div class="event-date-row">
                        <span class="event-gst" style="color:${color};">${gstStr}</span>
                        <span class="event-local">${localStr}</span>
                    </div>
                    <div class="op-header" style="margin-top:8px;">
                        <span class="op-title" style="font-size:1.1rem;">
                            <span class="op-type-tag" style="color:${color};border-color:${color};">${ev.type}</span>
                            ${ev.title}
                        </span>
                    </div>
                    <div class="op-desc" style="margin-top:5px;">${ev.desc}</div>
                    ${metaHtml}
                </div>`;
            }).join('');
        }

        // ─── NEWS TICKER ─────────────────────────────────────────────────────
        function renderNewsTicker() {
            const items = (typeof TICKER_ITEMS !== 'undefined' ? TICKER_ITEMS : []);

            const sep  = `<span class="ticker-separator">///</span>`;
            const html = [...items, ...items]
                .map(it => `<span class="ticker-item"><span class="ticker-tag">${it.tag}</span>${it.text}${sep}</span>`)
                .join('');
            document.getElementById('news-ticker').innerHTML = html;
        }

        // ─── INIT ────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            updateGSTClock();
            setInterval(updateGSTClock, 1000);
            restorePanelStates();
            renderSysNav();
            fetchSystemData();
            renderOperations();
            renderEvents();
            renderNewsTicker();
        });
    </script>
</body>
</html>
