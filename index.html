<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasabi Orbital Social Club Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Elite Dangerous Color Palette */
        :root {
            --ed-orange: #ff7100;
            --ed-orange-dim: rgba(255, 113, 0, 0.15);
            --ed-orange-glow: rgba(255, 113, 0, 0.4);
            --ed-cyan: #00e5ff;
            --ed-cyan-dim: rgba(0, 229, 255, 0.1);
            --bg-dark: #050505;
            --panel-bg: rgba(10, 8, 5, 0.85);
            --text-light: #f4f4f4;
            --danger: #ff3333;
            --success: #00ff44;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--ed-orange);
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
            background-image: radial-gradient(circle at center, #110d0a 0%, #000000 100%);
        }

        /* Subtle CRT Scanlines */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.08) 50%);
            background-size: 100% 4px; z-index: 100; pointer-events: none;
        }

        .container { max-width: 1100px; width: 100%; z-index: 1; }

        /* Top Header */
        .header {
            border-bottom: 2px solid var(--ed-orange); margin-bottom: 2rem; padding-bottom: 1rem;
            display: flex; justify-content: space-between; align-items: flex-end;
            box-shadow: 0 4px 10px -4px var(--ed-orange-glow);
        }
        .header h1 { font-size: 2.2rem; letter-spacing: 2px; text-shadow: 0 0 8px var(--ed-orange-glow); color: var(--ed-orange); }
        .header-sub { color: var(--ed-cyan); font-weight: 600; letter-spacing: 1px; text-shadow: 0 0 5px var(--ed-cyan-dim); }

				/* Dashboard Grid */
				.dashboard { display: grid; grid-template-columns: 1.3fr 1fr; gap: 2rem; align-items: start; }
				.dashboard-col { display: flex; flex-direction: column; gap: 2rem; }
				@media (max-width: 900px) { .dashboard { grid-template-columns: 1fr; } }

        /* Panels */
        .panel {
            background: var(--panel-bg); border: 1px solid var(--ed-orange);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5), inset 0 0 20px var(--ed-orange-dim);
            position: relative; display: flex; flex-direction: column; height: 100%;
        }
        .panel::before, .panel::after { content: ''; position: absolute; width: 10px; height: 10px; border: 2px solid var(--ed-cyan); }
        .panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

        .panel-header {
            background: var(--ed-orange-dim); padding: 0.75rem 1.5rem;
            border-bottom: 1px solid var(--ed-orange); display: flex; justify-content: space-between; align-items: center;
        }
        .panel-header h2 { font-size: 1.3rem; letter-spacing: 2px; color: var(--ed-cyan); text-shadow: 0 0 5px var(--ed-cyan-dim); }
        .panel-content { padding: 1.5rem; flex-grow: 1; }

        /* System Navigation */
        .sys-nav {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--ed-orange);
        }
        .sys-nav button {
            background: rgba(0, 229, 255, 0.05); border: 1px solid var(--ed-cyan); color: var(--ed-cyan);
            font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 1rem; padding: 4px 12px;
            cursor: pointer; text-transform: uppercase; transition: all 0.2s;
        }
        .sys-nav button:hover { background: var(--ed-cyan-dim); box-shadow: 0 0 8px var(--ed-cyan-dim); color: #fff; }
        
        /* New stacked name styling */
        .sys-name-container { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .sys-name { font-size: 1.5rem; color: var(--text-light); font-weight: 700; text-align: center; line-height: 1.1; }
        .sys-subtitle { font-size: 0.85rem; color: var(--ed-cyan); opacity: 0.8; letter-spacing: 1px; }

        /* Tabs */
        .tabs { display: flex; gap: 10px; margin-bottom: 1rem; border-bottom: 1px dashed var(--ed-orange-dim); padding-bottom: 10px; flex-wrap: wrap; }
        .tab-btn {
            background: transparent; border: 1px solid transparent; color: var(--ed-orange);
            font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; font-weight: 600; cursor: pointer;
            padding: 5px 10px; opacity: 0.6; transition: all 0.2s; text-transform: uppercase;
        }
        .tab-btn:hover { opacity: 1; border-bottom: 1px solid var(--ed-orange); }
        .tab-btn.active { opacity: 1; color: var(--ed-cyan); border-bottom: 2px solid var(--ed-cyan); text-shadow: 0 0 5px var(--ed-cyan-dim); }
        
        .tab-pane { display: none; max-height: 55vh; overflow-y: auto; padding-right: 5px; }
        .tab-pane.active { display: block; }
        
        .tab-pane::-webkit-scrollbar { width: 4px; }
        .tab-pane::-webkit-scrollbar-track { background: #111; }
        .tab-pane::-webkit-scrollbar-thumb { background: var(--ed-cyan); }

        /* Factions */
        .faction-item { background: rgba(0, 0, 0, 0.4); border: 1px solid var(--ed-orange-dim); padding: 10px; margin-bottom: 10px; }
        .faction-name { color: var(--ed-cyan); font-weight: 600; font-size: 1.1rem; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .faction-state { font-size: 0.85rem; color: var(--text-light); opacity: 0.8; }
        .inf-bar-bg { width: 100%; height: 4px; background: #111; margin-top: 8px; }
        .inf-bar-fill { height: 100%; background: var(--ed-orange); transition: width 1s ease-out; }
				.faction-item { cursor: pointer; transition: background 0.2s; }
				.faction-item:hover { background: rgba(0, 229, 255, 0.05); }
				/* Stellar Bodies (Expandable & Nested) */
        .body-item { margin-bottom: 6px; }
        .body-header {
            padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 0, 0, 0.4); border-left: 3px solid var(--ed-orange);
            cursor: pointer; transition: background 0.2s; border-bottom: 1px solid var(--ed-orange-dim);
        }
        .body-header:hover { background: rgba(255, 113, 0, 0.15); }
        .body-name { color: var(--text-light); font-weight: 600; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
        .body-type { color: var(--ed-orange); font-size: 0.8rem; opacity: 0.9; text-transform: uppercase; }
        .body-dist { color: var(--ed-cyan); font-size: 0.85rem; font-weight: 600; }
        .body-landable { padding: 1px 5px; border: 1px solid var(--ed-cyan); color: var(--ed-cyan); font-size: 0.7rem; border-radius: 2px; }

        .body-details {
            display: none; padding: 12px; background: rgba(0,0,0,0.6);
            border-left: 3px dashed var(--ed-orange-dim); font-size: 0.9rem;
            color: var(--text-light);
        }
        .body-details.active { display: block; }
        .body-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px; }
        .body-stat { display: flex; flex-direction: column; }
        .body-stat-label { font-size: 0.75rem; color: var(--ed-cyan); opacity: 0.8; font-weight: 600; }
        .body-stat-val { font-size: 0.95rem; }
        
        .body-children { 
            margin-left: 20px; 
            border-left: 1px dashed var(--ed-cyan-dim); 
            padding-left: 10px; 
            margin-top: 6px; 
            display: flex; 
            flex-direction: column; 
        }
        /* Installations (Expandable) */
        .location-item {
            background: rgba(0, 0, 0, 0.4); border: 1px solid var(--ed-cyan-dim); border-left: 3px solid var(--ed-cyan);
            margin-bottom: 8px; transition: all 0.2s;
        }
        .loc-header {
            padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
        }
        .loc-header:hover { background: rgba(0, 229, 255, 0.05); }
        .loc-details { display: flex; flex-direction: column; }
        .loc-name { color: var(--text-light); font-weight: 600; font-size: 1.1rem; }
        .loc-type { color: var(--ed-cyan); font-size: 0.85rem; opacity: 0.8; }
        .loc-dist { color: var(--ed-orange); font-size: 0.9rem; font-weight: 600; }
        
        .loc-body {
            display: none; padding: 12px; border-top: 1px dashed var(--ed-cyan-dim); background: rgba(0,0,0,0.6);
            font-size: 0.9rem;
        }
        .loc-body.active { display: block; }
        
        .service-tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
        .tag { background: #1a1a1a; border: 1px solid var(--ed-cyan-dim); color: var(--ed-cyan); padding: 2px 6px; font-size: 0.8rem; }
        
        .market-grid {
            display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 5px; margin-top: 10px;
            border: 1px solid var(--ed-orange-dim); padding: 5px; background: #0a0a0a;
        }
        .market-header { color: var(--ed-orange); font-weight: 600; border-bottom: 1px solid #333; padding-bottom: 3px; font-size: 0.8rem; }
        .market-row { color: var(--text-light); font-size: 0.85rem; padding: 2px 0; border-bottom: 1px solid #1a1a1a; }
        .market-row:last-child { border-bottom: none; }
        .market-supply { color: var(--ed-cyan); text-align: right; }
        .market-demand { color: var(--danger); text-align: right; }

				/* Operation Cards */
        .op-card { 
            border-left: 3px solid var(--ed-cyan); 
            background: rgba(0, 229, 255, 0.05); 
            padding: 1rem; 
            margin-bottom: 1rem; 
            transition: all 0.3s ease;
        }
        
        /* Operation Type Color Coding */
        .op-card.type-combat { border-left-color: var(--danger); background: rgba(255, 51, 51, 0.05); }
        .op-card.type-logistics { border-left-color: var(--success); background: rgba(0, 255, 68, 0.05); }
        .op-card.type-science { border-left-color: var(--ed-cyan); background: rgba(0, 229, 255, 0.05); }
        .op-card.type-criminal { border-left-color: #b026ff; background: rgba(176, 38, 255, 0.05); }
        .op-card.type-bgs { border-left-color: var(--ed-orange); background: var(--ed-orange-dim); }
        .op-card.type-other { border-left-color: #888888; background: rgba(136, 136, 136, 0.05); }
        
        .op-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; align-items: center; }
        .op-title { color: var(--text-light); font-weight: 700; font-size: 1.2rem; display: flex; align-items: center; gap: 8px;}
        .op-type-tag { font-size: 0.8rem; padding: 2px 6px; border: 1px solid currentColor; opacity: 0.9; font-weight: bold; letter-spacing: 1px;}
        
        .op-status { padding: 2px 8px; font-weight: bold; font-size: 0.85rem; color: var(--bg-dark); }
        
        .op-desc { color: var(--text-light); font-size: 0.95rem; line-height: 1.4; text-transform: none; opacity: 0.9; }
        
        /* Metadata Footer for Directives */
        .op-meta { 
            display: flex; flex-wrap: wrap; gap: 15px; margin-top: 12px; padding-top: 10px; 
            border-top: 1px dashed rgba(255, 255, 255, 0.15); font-size: 0.85rem; 
        }
        .op-meta-item { color: var(--text-light); display: flex; gap: 5px; opacity: 0.8; }
        .op-meta-label { font-weight: 600; }
        
        /* Match meta labels to card type */
        .type-combat .op-meta-label { color: var(--danger); }
        .type-logistics .op-meta-label { color: var(--success); }
        .type-science .op-meta-label { color: var(--ed-cyan); }
        .type-criminal .op-meta-label { color: #b026ff; }
        .type-bgs .op-meta-label { color: var(--ed-orange); }
        .type-other .op-meta-label { color: #888888; }
				
				
				/* Operation Progress Bars */
        .op-progress-container { 
            margin-top: 15px; 
            padding-top: 10px; 
            border-top: 1px dashed rgba(255, 255, 255, 0.15); 
        }
        .op-progress-header { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.85rem; 
            margin-bottom: 5px; 
            color: var(--text-light); 
            font-weight: 600;
        }
        .op-progress-bar-bg { 
            width: 100%; 
            height: 6px; 
            background: #111; 
            border: 1px solid var(--ed-cyan-dim); 
            position: relative; 
            overflow: hidden;
        }
        .op-progress-bar-fill { 
            height: 100%; 
            transition: width 1.5s cubic-bezier(0.1, 0.7, 0.1, 1); 
        }
				/* Event Cards */
				.event-card {
						border-left: 3px solid var(--ed-orange);
						background: rgba(255, 113, 0, 0.05);
						padding: 1rem;
						margin-bottom: 1rem;
						transition: all 0.3s ease;
				}

				.event-card:hover {
						background: var(--ed-orange-dim);
				}

				.event-date-row {
						display: flex;
						justify-content: space-between;
						align-items: center;
						font-size: 0.9rem;
						margin-bottom: 0.75rem;
						border-bottom: 1px dashed var(--ed-orange-dim);
						padding-bottom: 6px;
				}

				.event-gst {
						color: var(--ed-orange);
						font-weight: 700;
						letter-spacing: 1px;
				}

				.event-local {
						color: var(--ed-cyan);
						opacity: 0.8;
						font-weight: 600;
				}
        .ticker-wrap {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--ed-orange-dim);
            border-left: 3px solid var(--ed-orange);
            margin-bottom: 2rem;
            overflow: hidden;
            height: 45px;
            box-shadow: inset 0 0 15px rgba(255, 113, 0, 0.05);
        }
        
        .ticker-header {
            background: var(--ed-orange-dim);
            color: var(--ed-cyan);
            padding: 0 15px;
            font-weight: 700;
            height: 100%;
            display: flex;
            align-items: center;
            letter-spacing: 2px;
            border-right: 1px solid var(--ed-orange);
            z-index: 10;
            text-shadow: 0 0 5px var(--ed-cyan-dim);
            white-space: nowrap;
        }
        
        .ticker-content {
            flex-grow: 1;
            overflow: hidden;
            height: 100%;
            position: relative;
        }
        
        .ticker {
            display: inline-flex;
            align-items: center;
            height: 100%;
            white-space: nowrap;
            animation: ticker-crawl 35s linear infinite;
        }
        
        
        .ticker-item {
            display: inline-flex;
            align-items: center;
            font-size: 1.1rem;
            color: var(--text-light);
            font-weight: 500;
        }
        
        .ticker-tag {
            color: var(--ed-orange);
            border: 1px solid var(--ed-orange);
            padding: 1px 6px;
            font-size: 0.8rem;
            margin-right: 10px;
            font-weight: 700;
        }
        
        .ticker-separator {
            color: var(--ed-cyan);
            opacity: 0.3;
            margin: 0 3rem;
            font-weight: bold;
        }

				@keyframes ticker-crawl {
						0% { transform: translate3d(0, 0, 0); }
						100% { transform: translate3d(-50%, 0, 0); } /* Changed from -100% to -50% */
				}

        /* --- BGS Scanner Form Styles --- */
        .ed-input, .ed-select {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--ed-cyan-dim);
            color: var(--ed-cyan);
            font-family: 'Rajdhani', sans-serif;
            padding: 8px;
            width: 100%;
            text-transform: uppercase;
            outline: none;
            font-size: 1rem;
        }
        .ed-select option { background: var(--bg-dark); color: var(--text-light); }
        .ed-input:focus, .ed-select:focus { border-color: var(--ed-cyan); box-shadow: 0 0 5px var(--ed-cyan-dim); }
        .ed-label { display: block; color: var(--ed-orange); font-size: 0.85rem; margin-bottom: 4px; font-weight: 600; letter-spacing: 1px; }
        .ed-btn {
            background: var(--ed-orange-dim); border: 1px solid var(--ed-orange); color: var(--text-light);
            font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1.1rem; padding: 10px; cursor: pointer;
            width: 100%; text-transform: uppercase; transition: all 0.2s; margin-top: 10px; letter-spacing: 1px;
        }
				.ed-btn-danger {
						background: rgba(255, 51, 51, 0.1);
						border: 1px solid var(--danger);
						color: var(--danger);
				}
				.ed-btn-danger:hover:not(:disabled) {
						background: rgba(255, 51, 51, 0.3);
						box-shadow: 0 0 10px rgba(255, 51, 51, 0.4);
						color: #fff;
				}
        .ed-btn:hover:not(:disabled) { background: rgba(255, 113, 0, 0.3); box-shadow: 0 0 10px var(--ed-orange-glow); color: #fff; }
        .ed-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; color: #888; background: #222; }
        .bgs-grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; margin-bottom: 10px; }
        .state-toggle-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
            grid-column: 1 / -1; /* Spans across the grid */
        }
        
        .state-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #444;
            color: #888;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 4px 10px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .state-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
        
        /* Themed Active States */
        .state-btn.active-combat { border-color: var(--danger); color: var(--danger); background: rgba(255, 51, 51, 0.1); box-shadow: 0 0 8px rgba(255, 51, 51, 0.3); }
        .state-btn.active-econ { border-color: var(--ed-orange); color: var(--ed-orange); background: rgba(255, 113, 0, 0.1); box-shadow: 0 0 8px rgba(255, 113, 0, 0.3); }
        .state-btn.active-pol { border-color: var(--ed-cyan); color: var(--ed-cyan); background: rgba(0, 229, 255, 0.1); box-shadow: 0 0 8px rgba(0, 229, 255, 0.3); }
        .state-btn.active-crit { border-color: #b026ff; color: #b026ff; background: rgba(176, 38, 255, 0.1); box-shadow: 0 0 8px rgba(176, 38, 255, 0.3); }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    
    <div class="container">
				<header class="header">
            <div>
                <div id="gst-clock" style="color: var(--text-light); font-weight: 600; font-size: 1rem; letter-spacing: 2px; margin-bottom: 5px; opacity: 0.9;">
                    SYNCING TIME...
                </div>
                <h1>WASABI ORBITAL SOCIAL CLUB</h1>
                <div class="header-sub">SQUADRON INTERFACE</div>
            </div>
            <div style="text-align: right;">
                <div class="header-sub" style="color: var(--ed-orange);">Welcome, CMDR!</div>
                </div>
        </header>
				<div class="ticker-wrap">
            <div class="ticker-content">
                <div class="ticker" id="news-ticker">
                    </div>
            </div>
        </div>
				<main class="dashboard">
					<div class="dashboard-col">
							<section class="panel">
									<div class="panel-header">
											<h2>SYSTEM DATA</h2>
											<span>EDSM UPLINK</span>
									</div>
									<div class="panel-content">
											<div id="sys-nav-container"></div>
											
											<div class="tabs">
													<button class="tab-btn active" onclick="switchTab('factions')">FACTIONS</button>
													<button class="tab-btn" onclick="switchTab('locations')">LOCATIONS</button>
											</div>

											<div id="factions-tab" class="tab-pane active">
													<p class="loader">ESTABLISHING UPLINK...</p>
											</div>

											<div id="locations-tab" class="tab-pane">
													<p class="loader">SCANNING LOCAL SPACE...</p>
											</div>
									</div>
							</section>

							<section class="panel">
									<div class="panel-header">
											<h2>BGS SCANNER</h2>
											<span>NETWORK SEARCH</span>
									</div>
									<div class="panel-content">
											<div style="margin-bottom: 10px;">
													<label class="ed-label">ORIGIN SYSTEM</label>
													<select id="bgsPresetSystem" class="ed-select" onchange="toggleCustomBgsSystem()">
													</select>
													<input type="text" id="bgsCustomSystem" class="ed-input" placeholder="ENTER SYSTEM NAME" style="display: none; margin-top: 5px;">
											</div>
											<div class="bgs-grid">
													<div>
															<label class="ed-label">RADIUS (Ly)</label>
															<input type="number" id="bgsRadius" class="ed-input" value="40" min="1" max="100">
													</div>
													<div style="grid-column: 1 / -1;">
															<label class="ed-label">TARGET STATES</label>
															<div id="bgs-state-toggles" class="state-toggle-grid">
																	</div>
													</div>
											</div>
											<button id="bgsBtn" class="ed-btn" onclick="executeBgsSearch()">INITIATE BGS SWEEP</button>
											<button id="bgsStopBtn" class="ed-btn ed-btn-danger" onclick="stopBgsSweep()" style="display: none;">ABORT SWEEP</button>
											<div id="loader-bgs" class="loader" style="display:none; margin-top: 15px; color: var(--ed-cyan); font-style: italic;">QUERYING NETWORK...</div>
											<div id="result-box-bgs" style="margin-top: 15px;"></div>
									</div>
							</section>
					</div>

						<div class="dashboard-col">
								<section class="panel">
										<div class="panel-header">
												<h2>SQUADRON OPERATIONS</h2>
												<span>ONGOING OPS</span>
										</div>
										<div class="panel-content">
												<div class="tabs">
														<button class="tab-btn active" onclick="switchOpTab('ongoing')">ONGOING OPS</button>
														<button class="tab-btn" onclick="switchOpTab('archived')">ARCHIVED</button>
												</div>

												<div id="ongoing-tab" class="tab-pane active">
														<div id="operations-ongoing-container"></div>
												</div>
												
												<div id="archived-tab" class="tab-pane">
														<div id="operations-archived-container"></div>
												</div>
										</div>
								</section>

								<section class="panel">
										<div class="panel-header">
												<h2>UPCOMING EVENTS</h2>
												<span>SQUADRON CALENDAR</span>
										</div>
										<div class="panel-content">
												<div id="events-container">
														<p class="loader">SYNCING CALENDAR...</p>
												</div>
										</div>
								</section>
						</div>
				</main>
    </div>

    <script>
				// --- CONFIGURATION ---
        const COLONIZED_SYSTEMS = [
            { 
                realName: "Col 285 Sector CL-U b4-1", 
                nickName: "Wasabi Orbital System" 
            },
            { 
                realName: "Col 285 Sector DL-U b4-1", 
                nickName: "Traveler's Rest System" 
            }
        ];
        let currentSystemIndex = 0;

				let isBgsSweepActive = false;

				function stopBgsSweep() {
						isBgsSweepActive = false;
				}
        document.addEventListener('DOMContentLoaded', () => {
            renderSysNav();
            fetchSystemData();
            renderOperations();
						renderEvents();
						renderNewsTicker();
            populateBgsSystems();
						renderBgsStateButtons();
        });
				// BGS State Definitions & Theme Mapping
        const bgsStatesMap = [
            { name: "War", type: "combat" }, { name: "Civil War", type: "combat" }, 
            { name: "Civil Unrest", type: "combat" }, { name: "Terrorist Attack", type: "combat" }, 
            { name: "Pirate Attack", type: "combat" },
            { name: "Famine", type: "econ" }, { name: "Blight", type: "econ" }, 
            { name: "Drought", type: "econ" }, { name: "Infrastructure Failure", type: "econ" }, 
            { name: "Lockdown", type: "econ" },
            { name: "Election", type: "pol" }, { name: "Expansion", type: "pol" }, 
            { name: "Retreat", type: "pol" },
            { name: "Outbreak", type: "crit" }
        ];
        
        // Track selected states (Defaulting to War)
        let selectedBgsStates = new Set(['War']);

        function renderBgsStateButtons() {
            const container = document.getElementById('bgs-state-toggles');
            container.innerHTML = bgsStatesMap.map(state => {
                const isActive = selectedBgsStates.has(state.name) ? `active-${state.type}` : '';
                return `<button class="state-btn ${isActive}" data-state="${state.name}" data-type="${state.type}" onclick="toggleBgsState(this)">${state.name}</button>`;
            }).join('');
        }

        function toggleBgsState(btn) {
            const state = btn.dataset.state;
            const type = btn.dataset.type;
            if (selectedBgsStates.has(state)) {
                selectedBgsStates.delete(state);
                btn.classList.remove(`active-${type}`);
            } else {
                selectedBgsStates.add(state);
                btn.classList.add(`active-${type}`);
            }
        }
				function switchOpTab(tabId) {
            // Target only the tabs within the directives panel
            const directivePanel = document.getElementById('ongoing-tab').parentElement;
            directivePanel.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            directivePanel.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`${tabId}-tab`).classList.add('active');
        }
				function switchTab(tabId) {
						// Target only the tabs within the system data panel
						const systemPanel = document.getElementById('factions-tab').parentElement;
						
						// Remove active class from all buttons and panes in this section
						systemPanel.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
						systemPanel.querySelectorAll('.tab-pane').forEach(pane => pane.classList.remove('active'));
						
						// Add active class to the clicked button and the target pane
						event.target.classList.add('active');
						document.getElementById(`${tabId}-tab`).classList.add('active');
				}
				function renderSysNav() {
            const sys = COLONIZED_SYSTEMS[currentSystemIndex];
            const displayName = sys.nickName || sys.realName;
            const subtitleHtml = sys.nickName ? `<div class="sys-subtitle">${sys.realName}</div>` : '';

            document.getElementById('sys-nav-container').innerHTML = `
                <div class="sys-nav">
                    <button onclick="changeSystem(-1)">&#9664; PREV</button>
                    <div class="sys-name-container">
                        <div class="sys-name">${displayName}</div>
                        ${subtitleHtml}
                    </div>
                    <button onclick="changeSystem(1)">NEXT &#9654;</button>
                </div>
            `;
        }

        function changeSystem(direction) {
            currentSystemIndex = (currentSystemIndex + direction + COLONIZED_SYSTEMS.length) % COLONIZED_SYSTEMS.length;
            renderSysNav();
            fetchSystemData();
        }
				
				async function fetchSystemData() {
						const targetSystem = COLONIZED_SYSTEMS[currentSystemIndex].realName; 
						
						const factionsTab = document.getElementById('factions-tab');
						const locationsTab = document.getElementById('locations-tab');
						
						factionsTab.innerHTML = `<p class="loader">PULLING BGS DATA...</p>`;
						locationsTab.innerHTML = `<p class="loader">SCANNING SYSTEM & LOCAL SPACE...</p>`;
						
						try {
								// Fetch Factions, Stations, AND Bodies concurrently
								const [factionsRes, stationsRes, bodiesRes] = await Promise.all([
										fetch(`https://www.edsm.net/api-system-v1/factions?systemName=${encodeURIComponent(targetSystem)}`),
										fetch(`https://www.edsm.net/api-system-v1/stations?systemName=${encodeURIComponent(targetSystem)}`),
										fetch(`https://www.edsm.net/api-system-v1/bodies?systemName=${encodeURIComponent(targetSystem)}`)
								]);

								if (!factionsRes.ok || !stationsRes.ok || !bodiesRes.ok) throw new Error("EDSM Network Error");
								
								const factionsData = await factionsRes.json();
								const stationsData = await stationsRes.json();
								const bodiesData = await bodiesRes.json(); 
								
								// --- RENDER FACTIONS ---
								if (factionsData.factions?.length > 0) {
										const controlling = factionsData.controllingFaction?.name || "Unknown";
										factionsData.factions.sort((a, b) => b.influence - a.influence);
										
										let fHtml = `<div style="margin-bottom:15px; color:var(--text-light);">CONTROLLING: <span style="color:var(--ed-cyan);">${controlling}</span></div>`;
										
										factionsData.factions.forEach((faction, i) => {
												const inf = (faction.influence * 100).toFixed(1);
												const state = faction.state || "None";
												const isCtrl = faction.name === controlling;
												
												// Extract extended details
												const gov = faction.government || "Unknown";
												const allegiance = faction.allegiance || "Independent";
												const activeStates = (faction.activeStates && faction.activeStates.length > 0) ? faction.activeStates.map(s => s.state).join(', ') : 'None';
												const pendingStates = (faction.pendingStates && faction.pendingStates.length > 0) ? faction.pendingStates.map(s => s.state).join(', ') : 'None';
												
												fHtml += `
														<div class="faction-item" style="${isCtrl ? 'border-color: var(--ed-cyan);' : ''}" onclick="toggleFactionDetail('faction-detail-${i}')">
																<div class="faction-name"><span>${faction.name}</span><span>${inf}%</span></div>
																<div class="faction-state">STATE: <span style="color: ${state==='None' ? '#888' : 'var(--ed-orange)'}">${state}</span></div>
																<div class="inf-bar-bg"><div class="inf-bar-fill" style="width: ${inf}%; ${isCtrl ? 'background: var(--ed-cyan);' : ''}"></div></div>
																
																<div id="faction-detail-${i}" style="display: none; margin-top: 10px; font-size: 0.85rem; border-top: 1px dashed var(--ed-orange-dim); padding-top: 8px;">
																		<div style="color:var(--text-light); margin-bottom: 2px;"><span style="color:var(--ed-cyan); opacity: 0.8; font-weight: 600; font-size: 0.75rem;">ALLEGIANCE:</span> ${allegiance}</div>
																		<div style="color:var(--text-light); margin-bottom: 2px;"><span style="color:var(--ed-cyan); opacity: 0.8; font-weight: 600; font-size: 0.75rem;">GOVERNMENT:</span> ${gov}</div>
																		<div style="color:var(--text-light); margin-bottom: 2px;"><span style="color:var(--ed-orange); opacity: 0.8; font-weight: 600; font-size: 0.75rem;">ACTIVE:</span> ${activeStates}</div>
																		<div style="color:var(--text-light); margin-bottom: 2px;"><span style="color:#888; font-weight: 600; font-size: 0.75rem;">PENDING:</span> ${pendingStates}</div>
																</div>
														</div>
												`;
										});
										factionsTab.innerHTML = fHtml;
								} else {
										factionsTab.innerHTML = `<div style="opacity:0.6;">No BGS data available.</div>`;
								}

								// --- RENDER UNIFIED LOCATIONS ---
								const hasBodies = bodiesData.bodies?.length > 0;
								const hasStations = stationsData.stations?.length > 0;
								
								if (hasBodies || hasStations) {
										locationsTab.innerHTML = renderLocationsTree(bodiesData.bodies || [], stationsData.stations || [], targetSystem);
								} else {
										locationsTab.innerHTML = `<div style="opacity:0.6;">No location data available in EDSM for this system.</div>`;
								}

						} catch (error) {
								console.error("Error fetching system data:", error);
								factionsTab.innerHTML = `<div style="color:var(--danger); opacity:0.8;">ERROR ESTABLISHING UPLINK.</div>`;
								locationsTab.innerHTML = `<div style="color:var(--danger); opacity:0.8;">ERROR SCANNING LOCAL SPACE.</div>`;
						}
				}

				// --- UNIFIED LOCATION RENDERING FUNCTIONS ---
				function renderLocationsTree(bodies, stations, targetSystem) {
						const bodyMapById = {};
						const bodyMapByName = {};
						const roots = [];

						// Map all bodies
						bodies.forEach(b => {
								b.children = [];
								b.isStation = false;
								if (b.bodyId !== undefined) bodyMapById[b.bodyId] = b;
								if (b.name) bodyMapByName[b.name.toLowerCase()] = b;
						});

						// Map stations as children to their orbiting bodies
						stations.forEach((s, index) => {
								s.isStation = true;
								s.stationIndex = index;
								let attached = false;

								if (s.body) {
										if (s.body.id !== undefined && bodyMapById[s.body.id]) {
												bodyMapById[s.body.id].children.push(s);
												attached = true;
										} else if (s.body.name && bodyMapByName[s.body.name.toLowerCase()]) {
												bodyMapByName[s.body.name.toLowerCase()].children.push(s);
												attached = true;
										}
								}
								
								// If it doesn't have a parent body in EDSM, put it at the root of the system
								if (!attached) roots.push(s);
						});

						// Establish celestial body hierarchy (moons to planets, planets to stars)
						bodies.forEach(b => {
								let isRoot = true;
								
								if (b.parents && b.parents.length > 0) {
										let validParentId = null;
										for (let i = 0; i < b.parents.length; i++) {
												const parentType = Object.keys(b.parents[i])[0];
												if (parentType !== 'Null') {
														validParentId = b.parents[i][parentType];
														break;
												}
										}

										if (validParentId !== null && bodyMapById[validParentId]) {
												bodyMapById[validParentId].children.push(b);
												isRoot = false;
										}
								}
								
								if (isRoot) roots.push(b);
						});

						// Sort top level by distance
						roots.sort((a, b) => (a.distanceToArrival || 0) - (b.distanceToArrival || 0));

						let html = '';
						roots.forEach(root => {
								html += buildLocationHtml(root, targetSystem);
						});
						return html;
				}

				function buildLocationHtml(node, targetSystem) {
						// Render Installation / Station
						if (node.isStation) {
								const dist = node.distanceToArrival ? node.distanceToArrival.toLocaleString() + ' Ls' : 'Unknown';
								let displayType = node.type || 'Unknown Type';
								
								if (displayType === 'Odyssey Settlement') {
										displayType = 'Planetary Settlement';
								} else if (displayType === 'Unknown Type' && node.name && node.name.includes('Planetary Construction Site')) {
										displayType = 'Planetary Construction Site';
								}

								let servicesHtml = node.otherServices ? node.otherServices.map(s => `<span class="tag">${s}</span>`).join('') : '';
								let ecoHtml = node.economy ? `<span class="tag" style="color:var(--ed-orange); border-color:var(--ed-orange-dim)">${node.economy}</span>` : '';
								const safeStationName = node.name ? node.name.replace(/'/g, "\\'") : '';
								const index = node.stationIndex;

								// Pull controlling faction from EDSM data
								const controllingFactionHtml = node.controllingFaction ? `<div style="font-size: 0.85rem; margin-bottom: 10px; border-bottom: 1px dashed #333; padding-bottom: 5px;"><span style="color:var(--ed-cyan); opacity: 0.8; font-weight: 600;">CONTROLLING FACTION:</span> <span style="color:var(--text-light);">${node.controllingFaction.name}</span></div>` : '';

								return `
										<div class="location-item">
												<div class="loc-header" onclick="toggleLocation('${targetSystem}', '${safeStationName}', ${index}, ${node.haveMarket})">
														<div class="loc-details">
																<span class="loc-name">${node.name}</span>
																<span class="loc-type">${displayType}</span>
														</div>
														<div style="text-align: right;">
																<div class="loc-dist">${dist}</div>
																<div style="font-size: 0.7rem; color: #666;">CLICK FOR INFO</div>
														</div>
												</div>
												<div class="loc-body" id="loc-body-${index}">
														${controllingFactionHtml}
														<div style="color:var(--text-light); font-weight:600; margin-bottom:5px;">FACILITIES</div>
														<div class="service-tags">${ecoHtml} ${servicesHtml || '<span style="opacity:0.5">No explicit services logged.</span>'}</div>
														<div id="market-data-${index}" style="margin-top: 15px;"></div>
												</div>
										</div>
								`;
						}
						
						// Render Celestial Body
						else {
								// Sort children: Stations first, then celestial bodies by distance
								node.children.sort((a, b) => {
										if (a.isStation && !b.isStation) return -1;
										if (!a.isStation && b.isStation) return 1;
										return (a.distanceToArrival || 0) - (b.distanceToArrival || 0);
								});
								
								const dist = node.distanceToArrival ? node.distanceToArrival.toLocaleString() + ' Ls' : '0 Ls';
								const isLandable = node.isLandable ? '<span class="body-landable">LANDABLE</span>' : '';
								const typeStr = node.subType || node.type || 'Unknown';
								const safeId = node.id || Math.floor(Math.random() * 100000); 
								
								let detailsHtml = `<div class="body-grid">
										<div class="body-stat"><span class="body-stat-label">TYPE</span><span class="body-stat-val">${typeStr}</span></div>`;
								
								if (node.type === 'Star') {
										detailsHtml += `
												<div class="body-stat"><span class="body-stat-label">CLASS</span><span class="body-stat-val">${node.spectralClass || 'Unknown'}</span></div>
												<div class="body-stat"><span class="body-stat-label">SURFACE TEMP</span><span class="body-stat-val">${node.surfaceTemperature ? node.surfaceTemperature + ' K' : 'Unknown'}</span></div>
												<div class="body-stat"><span class="body-stat-label">SOLAR MASSES</span><span class="body-stat-val">${node.solarMasses ? node.solarMasses.toFixed(3) : 'Unknown'}</span></div>
										`;
								} else {
										detailsHtml += `
												<div class="body-stat"><span class="body-stat-label">EARTH MASSES</span><span class="body-stat-val">${node.earthMasses ? node.earthMasses.toFixed(4) : 'Unknown'}</span></div>
												<div class="body-stat"><span class="body-stat-label">GRAVITY</span><span class="body-stat-val">${node.gravity ? node.gravity.toFixed(2) + ' G' : 'Unknown'}</span></div>
												<div class="body-stat"><span class="body-stat-label">SURFACE TEMP</span><span class="body-stat-val">${node.surfaceTemperature ? node.surfaceTemperature + ' K' : 'Unknown'}</span></div>
										`;
										if (node.atmosphereType && node.atmosphereType !== "No atmosphere") {
												 detailsHtml += `<div class="body-stat"><span class="body-stat-label">ATMOSPHERE</span><span class="body-stat-val">${node.atmosphereType}</span></div>`;
										}
										if (node.volcanismType && node.volcanismType !== "No volcanism") {
												 detailsHtml += `<div class="body-stat"><span class="body-stat-label">VOLCANISM</span><span class="body-stat-val">${node.volcanismType}</span></div>`;
										}
								}
								detailsHtml += `</div>`; 

								if (node.rings && node.rings.length > 0) {
										 detailsHtml += `<div style="margin-top: 10px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 5px;"><span class="body-stat-label">RINGS</span>`;
										 node.rings.forEach(r => {
													detailsHtml += `<div style="font-size: 0.85rem; color: #ccc;">&#8226; ${r.name} <span style="color: var(--ed-orange); opacity: 0.8;">(${r.type})</span></div>`;
										 });
										 detailsHtml += `</div>`;
								}

								let html = `
										<div class="body-item">
												<div class="body-header" onclick="toggleBodyDetail('body-details-${safeId}')">
														<div class="body-name">${node.name} ${isLandable}</div>
														<div style="text-align:right;">
																<div class="body-dist">${dist}</div>
																<div class="body-type">${node.type}</div>
														</div>
												</div>
												<div class="body-details" id="body-details-${safeId}">
														${detailsHtml}
												</div>
								`;

								if (node.children.length > 0) {
										html += `<div class="body-children">`;
										node.children.forEach(child => {
												html += buildLocationHtml(child, targetSystem); // Recursively build children
										});
										html += `</div>`;
								}

								html += `</div>`;
								return html;
						}
				}

        function toggleBodyDetail(id) {
            // Removed the rogue 'event' reference that paralyzes non-Chromium browsers
            const el = document.getElementById(id);
            if(el) el.classList.toggle('active');
        }
				//=====================================================
        // [ SQUADRON FEED ]
        // Add scrolling ticker updates here.
        // - tag:  (Optional) Short category label (e.g., 'ALERT', 'BGS', 'GALNET')
        // - text: (Required) The news message.
        // ===================================================================
        const commsFeed = [
            { tag: "OPERATION", text: "Operation to exile Kasho Purple Rats is currently underway." },
			{ tag: "ALERT", text: "Pause all Colonization operations in Wasabi Orbital System until the Kasho Purple Rats are exiled." },
            { tag: "COLONIZATION", text: "Continue Colonization of Traveler's Rest System." },
            { tag: "NOTICE", text: "Don't fall for any April Fool's Jokes!" }
        ];
				
				function renderNewsTicker() {
						const tickerContainer = document.getElementById('news-ticker');
						if (!tickerContainer) return;

						if (commsFeed.length === 0) {
								tickerContainer.innerHTML = `<div class="ticker-item" style="opacity: 0.5;">NO ACTIVE TRANSMISSIONS</div>`;
								return;
						}

						let html = '';
						commsFeed.forEach((item) => {
								const tagHtml = item.tag ? `<span class="ticker-tag">${item.tag}</span>` : '';
								
								// Always add the separator so the end of the list connects smoothly to the duplicated list
								const separator = `<span class="ticker-separator">//</span>`; 
								
								html += `<div class="ticker-item">${tagHtml}${item.text}${separator}</div>`;
						});

						// Duplicate the HTML string to allow for a seamless CSS loop
						tickerContainer.innerHTML = html + html;
				}
				function toggleFactionDetail(id) {
						const el = document.getElementById(id);
						if(el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
				}
        // --- DYNAMIC MARKET UPLINK ---
        async function toggleLocation(systemName, stationName, index, hasMarket) {
            const bodyDiv = document.getElementById(`loc-body-${index}`);
            const marketContainer = document.getElementById(`market-data-${index}`);
            
            // Toggle visibility
            bodyDiv.classList.toggle('active');
            
            // If opening and we haven't fetched market data yet
            if (bodyDiv.classList.contains('active') && !marketContainer.dataset.loaded) {
                
                if (!hasMarket) {
                    marketContainer.innerHTML = `<div style="color:#888; font-style:italic;">NO COMMODITIES MARKET AT THIS LOCATION.</div>`;
                    marketContainer.dataset.loaded = "true";
                    return;
                }

                marketContainer.innerHTML = `<div class="loader" style="font-size:0.8rem; padding: 5px;">REQUESTING MARKET MANIFEST...</div>`;
                
                try {
                    const res = await fetch(`https://www.edsm.net/api-system-v1/stations/market?systemName=${encodeURIComponent(systemName)}&stationName=${encodeURIComponent(stationName)}`);
                    const data = await res.json();
                    
								if (data && data.commodities && data.commodities.length > 0) {
										// Grab top 4 by demand
										let itemsWithDemand = data.commodities.filter(c => c.demand > 0)
												.sort((a, b) => b.demand - a.demand).slice(0, 4);
										
										// Grab top 4 by supply
										let itemsWithSupply = data.commodities.filter(c => c.stock > 0)
												.sort((a, b) => b.stock - a.stock).slice(0, 4);

										// Combine and deduplicate (in case an item has both high demand and supply)
										let combinedMap = new Map();
										itemsWithDemand.forEach(i => combinedMap.set(i.id, i));
										itemsWithSupply.forEach(i => combinedMap.set(i.id, i));
										let topItems = Array.from(combinedMap.values()).slice(0, 8);
										
										// Sort final list alphabetically for easier reading
										topItems.sort((a, b) => a.name.localeCompare(b.name));
										
										let tableHtml = `
												<div style="color:var(--text-light); font-weight:600; margin-bottom:5px; display:flex; justify-content:space-between;">
														<span>MARKET MANIFEST</span>
														<span style="font-size:0.7rem; color:var(--ed-cyan); opacity:0.7;">TOP SUPPLY & DEMAND</span>
												</div>
												<div class="market-grid">
														<div class="market-header">COMMODITY</div>
														<div class="market-header" style="text-align:right;">SUPPLY</div>
														<div class="market-header" style="text-align:right;">DEMAND</div>
										`;
										
										topItems.forEach(item => {
												tableHtml += `
														<div class="market-row" style="color:var(--ed-orange);">${item.name}</div>
														<div class="market-row market-supply">${item.stock > 0 ? item.stock.toLocaleString() : '-'}</div>
														<div class="market-row market-demand">${item.demand > 0 ? item.demand.toLocaleString() : '-'}</div>
												`;
										});
										
										tableHtml += `</div>`;
										marketContainer.innerHTML = tableHtml;
								} else {
										marketContainer.innerHTML = `<div style="color:#888; font-style:italic;">MARKET DATA OUTDATED OR UNAVAILABLE.</div>`;
								}
                    
                    marketContainer.dataset.loaded = "true"; // Prevent refetching on every open/close

                } catch (err) {

				// --- PROGRESS DATA UPLINK ---
        async function hydrateOperationProgress() {
            // Store operations in an array of promises to run concurrently
            const progressPromises = operationsData.map(async (op, index) => {
                if (!op.progress) return;
                
                const container = document.getElementById(`op-prog-${index}`);
                if (!container) return;

                let currentVal = op.progress.current;

                // 1. Fetch from EDSM if configured
                if (op.progress.source === 'edsm_faction') {
                    try {
                        const res = await fetch(`https://www.edsm.net/api-system-v1/factions?systemName=${encodeURIComponent(op.progress.system)}`);
                        if (!res.ok) throw new Error("Uplink failed");
                        const data = await res.json();
                        const faction = data.factions.find(f => f.name === op.progress.faction);
                        
                        if (faction) {
                            currentVal = faction.influence * 100;
                        } else {
                            throw new Error("Faction missing in EDSM logs");
                        }
                    } catch (err) {
                        container.innerHTML = `<div style="color: var(--danger); font-size: 0.85rem; padding-top: 10px;">PROGRESS DATA UPLINK FAILED</div>`;
                        return;
                    }
                }

                // 2. Render UI based on tracking type
                if (currentVal !== null && currentVal !== undefined) {
                    let target = op.progress.target;
                    
                    // Match visual color to operation type
                    let opType = op.type ? op.type.toLowerCase() : 'other';
                    let themeColor = 'var(--ed-orange)'; 
                    if (opType === 'combat') themeColor = 'var(--danger)';
                    else if (opType === 'logistics') themeColor = 'var(--success)';
                    else if (opType === 'science') themeColor = 'var(--ed-cyan)';
                    else if (opType === 'criminal') themeColor = '#b026ff';

                    // TYPE A: Strict Percentage Tracking
                    // FIX: Ensure 'start' is explicitly a number so it never randomly triggers on null/empty strings
                    if (typeof op.progress.start === 'number') {
                        let pct = 0;
                        let start = op.progress.start;
                        
                        if (op.progress.lowerIsBetter) {
                            let totalDiff = start - target;
                            let currentDiff = start - currentVal;
                            pct = (totalDiff === 0) ? 100 : (currentDiff / totalDiff) * 100;
                        } else {
                            let totalDiff = target - start;
                            let currentDiff = currentVal - start;
                            pct = (totalDiff === 0) ? 100 : (currentDiff / totalDiff) * 100;
                        }

                        // Clamp percentage between 0 and 100
                        pct = Math.max(0, Math.min(100, pct));

                        container.innerHTML = `
                            <div class="op-progress-header">
                                <span>CURRENT: ${currentVal.toFixed(1)}${op.progress.unit} / TARGET: ${target}${op.progress.unit}</span>
                                <span>${pct.toFixed(0)}%</span>
                            </div>
                            <div class="op-progress-bar-bg">
                                <div class="op-progress-bar-fill" style="width: ${pct}%; background: ${themeColor};"></div>
                            </div>
                        `;
                    } 
                    // TYPE B: Threshold Goal Tracking 
                    // FIX: Replaced "Delta" with actionable visual cues
                    else {
                        let isMet = op.progress.lowerIsBetter ? (currentVal <= target) : (currentVal >= target);
                        let operator = op.progress.lowerIsBetter ? '≤' : '≥';
                        
                        let statusText = isMet ? 'CONDITION MET' : 'TRACKING...';
                        let statusColor = isMet ? 'var(--success)' : themeColor;
                        
                        let directionAction = op.progress.lowerIsBetter ? 'REDUCE TO' : 'PUSH TO';
                        let arrowSymbol = op.progress.lowerIsBetter ? '&#8681;' : '&#8679;';

                        container.innerHTML = `
                            <div class="op-progress-header" style="color: ${statusColor}; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 3px;">
                                <span>THRESHOLD SENSOR</span>
                                <span>${statusText}</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); padding: 8px 12px; margin-top: 5px; border-left: 3px solid ${statusColor};">
                                <div style="font-size: 1.1rem; font-weight: 700; color: var(--text-light);">
                                    <span style="opacity: 0.5; font-size: 0.75rem; display: block; margin-bottom: -2px;">CURRENT</span>
                                    ${currentVal.toFixed(1)}${op.progress.unit}
                                </div>
                                
                                <div style="flex-grow: 1; text-align: center; font-size: 0.95rem; font-weight: 700; color: ${statusColor}; opacity: 0.8; letter-spacing: 1px; padding: 0 10px;">
                                    ${isMet ? '&#10003; SECURED' : `${arrowSymbol} ${directionAction} ${arrowSymbol}`}
                                </div>

                                <div style="font-size: 1.1rem; font-weight: 700; color: var(--ed-cyan); opacity: 0.9; text-align: right;">
                                    <span style="opacity: 0.5; font-size: 0.75rem; display: block; margin-bottom: -2px;">TARGET</span>
                                    ${operator} ${target}${op.progress.unit}
                                </div>
                            </div>
                        `;
                    }
                }
            });

            await Promise.all(progressPromises);
        }

        function updateGSTClock() {
            const now = new Date();
            
            // Elite Dangerous takes place exactly 1286 years in the future
            const edYear = now.getUTCFullYear() + 1286; 
            
            // Format Month string
            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            const monthStr = months[now.getUTCMonth()];
            
            // Pad single digits with leading zeros
            const day = String(now.getUTCDate()).padStart(2, '0');
            const hours = String(now.getUTCHours()).padStart(2, '0');
            const minutes = String(now.getUTCMinutes()).padStart(2, '0');
            const seconds = String(now.getUTCSeconds()).padStart(2, '0');
            
            // Construct the final string (e.g., "30 MAR 3312 // 06:17:13 GST")
            const timeString = `${day} ${monthStr} ${edYear} // ${hours}:${minutes}:${seconds} GST`;
            
            document.getElementById('gst-clock').innerText = timeString;
        }

        // Initialize clock immediately, then update every 1000ms (1 second)
        updateGSTClock();
        setInterval(updateGSTClock, 1000);

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function calcDistance(sys1, sys2) {
            const getCoords = (s) => s.coords || { x: s.x, y: s.y, z: s.z };
            const c1 = getCoords(sys1);
            const c2 = getCoords(sys2);
            if (c1.x === undefined || c2.x === undefined) return 0;
            return Math.sqrt(Math.pow(c2.x - c1.x, 2) + Math.pow(c2.y - c1.y, 2) + Math.pow(c2.z - c1.z, 2));
        }

        async function fetchSpanshSphere(coords, size = 150) {
            const targetUrl = "https://www.spansh.co.uk/api/systems/search";
            const endpoints = [ `https://edsm.nicolash1298.workers.dev/?${targetUrl}` ];

            let spanshRes = null;
            for (const url of endpoints) {
                try {
                    spanshRes = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            filters: {}, sort: [{ distance: { direction: "asc" } }], size: size,
                            reference_coords: { x: coords.x, y: coords.y, z: coords.z }
                        })
                    });
                    if (spanshRes.ok) break;
                } catch (err) {}
            }
            
            if (!spanshRes || !spanshRes.ok) throw new Error("Spansh database uplink failed.");

            const spanshData = await spanshRes.json();
            let spanshSystems = spanshData.results || [];

            if (spanshData.reference) {
                for (let attempts = 0; attempts < 15; attempts++) {
                    await new Promise(r => setTimeout(r, 1000));
                    try {
                        const pollRes = await fetch(`https://www.spansh.co.uk/api/results/${spanshData.reference}`);
                        if (!pollRes.ok) continue;
                        const pollData = await pollRes.json();
                        if (pollData.status === 'ok' && pollData.results) {
                            spanshSystems = pollData.results;
                            break;
                        }
                    } catch (e) {}
                }
            }
            return spanshSystems;
        }

								alert("Please select at least one Target State from the toggle grid.");

						// Toggle UI for active sweep
						isBgsSweepActive = true;
						btn.style.display = 'none';
						stopBtn.style.display = 'block';
						
						loader.style.display = 'block';
						resultBox.style.display = 'block';

						try {

								const coordRes = await fetch(`https://www.edsm.net/api-v1/system?systemName=${encodeURIComponent(systemInput)}&showCoordinates=1`);
								const coordData = await coordRes.json();

								let spanshSystems = await fetchSpanshSphere(coordData.coords, 500);

								spanshSystems.forEach(sys => { sys.distance = calcDistance(coordData.coords, sys); });

								const searchPool = shuffleArray(spanshSystems.filter(sys => sys.distance <= parseFloat(radiusInput) && sys.distance > -1 && sys.population > 0));
								
								if (searchPool.length === 0) throw new Error(`Search area exhausted. No populated systems found in radius.`);

								await handleBgsLogic(searchPool, loader, resultBox);

						} catch (error) {
								resultBox.innerHTML = `<div style="color: var(--danger); border-left: 3px solid var(--danger); padding: 10px; background: rgba(255, 51, 51, 0.05); margin-bottom: 10px;">${error.message}</div>`;
						} finally {
								// Reset UI when sweep finishes or is aborted
								isBgsSweepActive = false;
								btn.style.display = 'block';
								stopBtn.style.display = 'none';
								loader.style.display = 'none';
						}
				}

				async function handleBgsLogic(searchPool, loader, resultBox) {
						const bgsSolutions = {
								'Famine': { desc: "Severe shortage of vital Commodities.", action: "Deliver Food Cartridges to their stations. Look for 'Distribution Centre' signal sources.", sourcing: "Agriculture" },
								'Outbreak': { desc: "A contagious disease has begun sweeping through the population.", action: "Deliver Medicines. Combat missions provide no benefit.", sourcing: "High Tech" },
								'War': { desc: "Factions are resolving a conflict over assets via military force.", action: "Fight in Conflict Zones, complete combat missions, hand in Combat Bonds.", sourcing: null },
								'Civil War': { desc: "Internal factions are resolving a conflict over assets via military force.", action: "Fight in Conflict Zones, complete combat missions, hand in Combat Bonds.", sourcing: null },
								'Election': { desc: "Factions with similar ideologies are resolving a conflict peacefully.", action: "Conduct trade activity and complete non-combat missions. Combat has no effect.", sourcing: null },
								'Civil Unrest': { desc: "Standard of living and security are dropping significantly.", action: "Conduct Bounty Hunting in the system. Combat actions are highly effective.", sourcing: null },
								'Lockdown': { desc: "Low security has locked down system wealth and services.", action: "Bounty Hunting shortens lockdown. Checkpoints and Pirate Activity signal sources appear.", sourcing: null },
								'Blight': { desc: "An aggressive pathogen is destroying crops.", action: "Deliver Agronomic Treatment to counter the blight before it triggers a Famine.", sourcing: "Industrial or Agriculture" },
								'Drought': { desc: "Dwindling water supplies are severely straining the economy.", action: "Deliver Water and emergency supplies.", sourcing: "Ice Refinery or Extraction" },
								'Infrastructure Failure': { desc: "Disrupted operations are negatively affecting Security and Economy.", action: "Deliver Food and Machinery commodities to hasten repairs.", sourcing: "Agriculture or Industrial" },
								'Terrorist Attack': { desc: "A prosperous faction has been targeted by terrorists.", action: "Conduct Bounty Hunting and deliver legal Weapons for local authorities.", sourcing: "High Tech or Military" },
								'Pirate Attack': { desc: "Pirates are invading the system.", action: "Conduct Bounty Hunting. Look for 'Pirate Activity Detected' signal sources.", sourcing: null },
								'Expansion': { desc: "Faction exceeded 75% influence and is expanding.", action: "Run missions for them in the target system to establish a foothold.", sourcing: null },
								'Retreat': { desc: "Faction dropped below 2.5% influence and is being expelled.", action: "Urgently conduct trade and run missions to raise influence above 2.5%.", sourcing: null }
						};

						const conflictStates = ['War', 'Civil War', 'Election'];

						let poolCopy = [...searchPool].sort((a,b) => a.distance - b.distance);
						let foundCount = 0;
						const totalSystems = poolCopy.length;

						for (let i = 0; i < totalSystems; i++) {
							if (!isBgsSweepActive) {
									resultBox.innerHTML += `
											<div style="color: var(--danger); border-left: 3px solid var(--danger); padding: 10px; background: rgba(255, 51, 51, 0.05); margin-top: 15px; font-weight: bold;">
													SWEEP ABORTED BY COMMANDER.
											</div>
									`;
									break; // Exits the loop immediately
							}
								const sys = poolCopy[i];
								loader.innerText = `3/3: AUDITING FACTIONS... (${i+1}/${totalSystems}) | FOUND: ${foundCount}`;

								try {
										const facRes = await fetch(`https://www.edsm.net/api-system-v1/factions?systemName=${encodeURIComponent(sys.name)}`);
										const facData = await facRes.json();

										if (facData.factions) {
												let matchedFactionsByState = {};

												// Step 1: Strictly isolate factions to their respective selected states
												for (const faction of facData.factions) {
														let allFactionStates = [];
														if (faction.state && faction.state !== "None") allFactionStates.push(faction.state);
														if (faction.activeStates) faction.activeStates.forEach(s => allFactionStates.push(s.state));
														
														// Deduplicate in case EDSM logs the same state in both properties
														allFactionStates = [...new Set(allFactionStates)];
														
														let matchedStates = allFactionStates.filter(s => selectedBgsStates.has(s));

														matchedStates.forEach(mState => {
																if (!matchedFactionsByState[mState]) matchedFactionsByState[mState] = [];
																matchedFactionsByState[mState].push(faction);
														});
												}

												// Step 2: Render the system card only if we found matches
												if (Object.keys(matchedFactionsByState).length > 0) {
														foundCount++;
														
														let systemHtml = `
																<div class="op-card type-bgs" style="animation: fadeIn 0.5s ease-out; margin-bottom: 15px;">
																		<div class="op-header" style="border-bottom: 1px solid var(--ed-orange-dim); padding-bottom: 8px; margin-bottom: 10px;">
																				<span class="op-title">
																						<span class="op-type-tag" style="color: var(--ed-orange); border-color: var(--ed-orange)">BGS HIT</span>
																						${sys.name}
																				</span>
																				<span class="op-status" style="background: var(--ed-orange); color: var(--bg-dark);">${sys.distance.toFixed(2)} Ly</span>
																		</div>
														`;

														// Render distinct UI blocks for each state found in the system
														for (const [mState, factions] of Object.entries(matchedFactionsByState)) {
																const rule = bgsSolutions[mState] || bgsSolutions['War'];
																const stateTheme = bgsStatesMap.find(b => b.name === mState)?.type || 'econ';
																
																let tagColor = 'var(--ed-orange)';
																if(stateTheme === 'combat') tagColor = 'var(--danger)';
																if(stateTheme === 'pol') tagColor = 'var(--ed-cyan)';
																if(stateTheme === 'crit') tagColor = '#b026ff';

																// Build the faction list for this specific state
																let factionsListHtml = '';

																// Explicitly handle conflict states
																if (conflictStates.includes(mState)) {
																		if (factions.length === 2) {
																				// Standard 1v1 Conflict layout
																				factionsListHtml = `
																						<div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 6px 10px; border-left: 2px solid ${tagColor}; margin-bottom: 2px;">
																								<span style="font-weight: 600; color: var(--text-light);">${factions[0].name}</span>
																								<span style="color: var(--ed-cyan); font-size: 0.9rem;">${(factions[0].influence * 100).toFixed(1)}%</span>
																						</div>
																						<div style="text-align: center; color: var(--danger); font-weight: 800; font-size: 0.8rem; margin: 4px 0; letter-spacing: 2px;">VS</div>
																						<div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 6px 10px; border-left: 2px solid ${tagColor}; margin-bottom: 6px;">
																								<span style="font-weight: 600; color: var(--text-light);">${factions[1].name}</span>
																								<span style="color: var(--ed-cyan); font-size: 0.9rem;">${(factions[1].influence * 100).toFixed(1)}%</span>
																						</div>
																				`;
																		} else if (factions.length === 1) {
																				// EDSM Data Sync Issue: Only one faction reported the state
																				factionsListHtml = `
																						<div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 6px 10px; border-left: 2px solid ${tagColor}; margin-bottom: 2px;">
																								<span style="font-weight: 600; color: var(--text-light);">${factions[0].name}</span>
																								<span style="color: var(--ed-cyan); font-size: 0.9rem;">${(factions[0].influence * 100).toFixed(1)}%</span>
																						</div>
																						<div style="text-align: center; color: var(--danger); font-weight: 800; font-size: 0.8rem; margin: 4px 0; letter-spacing: 2px;">VS</div>
																						<div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 6px 10px; border-left: 2px solid #555; margin-bottom: 6px; opacity: 0.7;">
																								<span style="font-weight: 600; color: #888; font-style: italic;">[OPPONENT DATA MISSING IN EDSM]</span>
																								<span style="color: #888; font-size: 0.9rem;">--%</span>
																						</div>
																				`;
																		} else {
																				// Fallback if 3+ factions somehow share the exact same conflict state
																				factionsListHtml = factions.map(f => `
																						<div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 6px 10px; border-left: 2px solid ${tagColor}; margin-bottom: 4px;">
																								<span style="font-weight: 600; color: var(--text-light);">${f.name}</span>
																								<span style="color: var(--ed-cyan); font-size: 0.9rem;">${(f.influence * 100).toFixed(1)}%</span>
																						</div>
																				`).join('');
																		}
																} else {
																		// Standard stacking for everything else (Outbreaks, Famine, etc.)
																		factionsListHtml = factions.map(f => `
																				<div style="display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 6px 10px; border-left: 2px solid ${tagColor}; margin-bottom: 4px;">
																						<span style="font-weight: 600; color: var(--text-light);">${f.name}</span>
																						<span style="color: var(--ed-cyan); font-size: 0.9rem;">${(f.influence * 100).toFixed(1)}%</span>
																				</div>
																		`).join('');
																}

																// Wrap it in a state-specific container
																systemHtml += `
																		<div style="margin-bottom: 12px; padding: 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);">
																				<div style="color: ${tagColor}; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; display: inline-block; border-bottom: 1px solid ${tagColor}; padding-bottom: 2px;">
																						${mState.toUpperCase()}
																				</div>
																				
																				<div style="margin-bottom: 10px;">
																						${factionsListHtml}
																				</div>

																				<div style="font-size: 0.85rem; color: var(--text-light); opacity: 0.9; margin-bottom: 4px;">${rule.desc}</div>
																				<div style="font-size: 0.85rem;"><span style="color: var(--ed-cyan);">ACTION:</span> ${rule.action}</div>
																				${rule.sourcing ? `<div style="font-size: 0.85rem; margin-top: 4px; color: #aaa;">SOURCING: ${rule.sourcing}</div>` : ''}
																		</div>
																`;
														}

														systemHtml += `</div>`;
														resultBox.innerHTML += systemHtml;
												}
										}
								} catch (e) {
										console.error("Faction fetch error", e);
								}
								await new Promise(r => setTimeout(r, 800));
						}

						if (foundCount === 0) {
								resultBox.innerHTML = `
										<div style="color: var(--ed-cyan); border-left: 3px solid var(--ed-cyan); padding: 10px; background: rgba(0, 229, 255, 0.05);">
												NO FACTIONS EXPERIENCING SELECTED STATES FOUND WITHIN ${document.getElementById('bgsRadius').value} LY.
										</div>
								`;
						}
				}
    </script>
</body>
</html>
