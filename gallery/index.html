<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squadron Gallery // WOSC Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ed-orange:      #ff7100;
            --ed-orange-dim:  rgba(255, 113, 0, 0.15);
            --ed-orange-glow: rgba(255, 113, 0, 0.4);
            --ed-cyan:        #00e5ff;
            --ed-cyan-dim:    rgba(0, 229, 255, 0.1);
            --bg-dark:        #050505;
            --panel-bg:       rgba(10, 8, 5, 0.85);
            --text-light:     #f4f4f4;
            --danger:         #ff3333;
            --success:        #00ff44;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--ed-orange);
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
            background-image: radial-gradient(circle at center, #110d0a 0%, #000000 100%);
        }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.08) 50%);
            background-size: 100% 4px; z-index: 100; pointer-events: none;
        }

        .container { max-width: 1200px; width: 100%; z-index: 1; }

        /* Header */
        .header {
            border-bottom: 2px solid var(--ed-orange); margin-bottom: 2rem; padding-bottom: 1rem;
            display: flex; justify-content: space-between; align-items: flex-end;
            box-shadow: 0 4px 10px -4px var(--ed-orange-glow);
        }
        .header h1 { font-size: 2.2rem; letter-spacing: 2px; text-shadow: 0 0 8px var(--ed-orange-glow); color: var(--ed-orange); }
        .header-sub { color: var(--ed-cyan); font-weight: 600; letter-spacing: 1px; text-shadow: 0 0 5px var(--ed-cyan-dim); }

        /* Site Navigation */
        .site-nav {
            display: flex; margin-bottom: 2rem; flex-wrap: wrap;
            border: 1px solid var(--ed-orange-dim);
            border-bottom: 2px solid var(--ed-orange);
            background: rgba(0, 0, 0, 0.5); width: fit-content;
        }
        .site-nav a {
            display: block; padding: 8px 22px; color: var(--ed-orange);
            text-decoration: none; font-weight: 700; font-size: 1rem; letter-spacing: 2px;
            opacity: 0.55; border-right: 1px solid var(--ed-orange-dim); transition: all 0.2s;
            text-transform: uppercase;
        }
        .site-nav a:last-child { border-right: none; }
        .site-nav a:hover { opacity: 1; background: var(--ed-orange-dim); }
        .site-nav a.active {
            opacity: 1; color: var(--ed-cyan); background: rgba(0, 229, 255, 0.07);
            text-shadow: 0 0 6px rgba(0, 229, 255, 0.3);
            border-bottom: 2px solid var(--ed-cyan); margin-bottom: -2px;
        }

        /* Panel */
        .panel {
            background: var(--panel-bg); border: 1px solid var(--ed-orange);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5), inset 0 0 20px var(--ed-orange-dim);
            position: relative;
        }
        .panel::before, .panel::after { content: ''; position: absolute; width: 10px; height: 10px; border: 2px solid var(--ed-cyan); }
        .panel::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .panel::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
        .panel-header {
            background: var(--ed-orange-dim); padding: 0.75rem 1.5rem;
            border-bottom: 1px solid var(--ed-orange); display: flex; justify-content: space-between; align-items: center;
        }
        .panel-header h2 { font-size: 1.3rem; letter-spacing: 2px; color: var(--ed-cyan); text-shadow: 0 0 5px var(--ed-cyan-dim); }
        .panel-content { padding: 1.5rem; }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .gallery-item {
            position: relative; overflow: hidden;
            border: 1px solid var(--ed-orange-dim);
            background: rgba(0, 0, 0, 0.6);
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
            aspect-ratio: 1 / 1;
        }
        .gallery-item:hover {
            border-color: var(--ed-cyan);
            box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
        }
        .gallery-item::before, .gallery-item::after {
            content: ''; position: absolute; width: 8px; height: 8px; border: 1px solid var(--ed-cyan);
            opacity: 0; transition: opacity 0.2s; z-index: 2;
        }
        .gallery-item::before { top: 4px; left: 4px; border-right: none; border-bottom: none; }
        .gallery-item::after  { bottom: 4px; right: 4px; border-left: none; border-top: none; }
        .gallery-item:hover::before, .gallery-item:hover::after { opacity: 1; }

        .gallery-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }
        .gallery-item:hover img {
            transform: scale(1.04);
        }

        .gallery-item-label {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            color: var(--text-light); font-size: 0.72rem; letter-spacing: 1px;
            padding: 20px 8px 6px;
            opacity: 0; transition: opacity 0.2s;
            word-break: break-all;
        }
        .gallery-item:hover .gallery-item-label { opacity: 1; }

        /* Status messages */
        .gallery-status {
            text-align: center; padding: 3rem 1rem;
            color: var(--ed-cyan); opacity: 0.5; font-size: 1rem; letter-spacing: 2px;
        }
        .gallery-status.error { color: var(--danger); opacity: 0.8; }

        /* Count badge */
        .gallery-count {
            color: var(--ed-orange); font-size: 0.85rem; letter-spacing: 1px; opacity: 0.7;
        }

        /* Lightbox */
        .lightbox {
            display: none; position: fixed; inset: 0; z-index: 9000;
            background: rgba(0, 0, 0, 0.93);
            align-items: center; justify-content: center;
        }
        .lightbox.open { display: flex; }

        .lightbox-backdrop {
            position: absolute; inset: 0; cursor: zoom-out;
        }

        .lightbox-inner {
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center;
            max-width: 90vw; max-height: 90vh;
        }

        .lightbox-img {
            max-width: 90vw; max-height: 80vh;
            object-fit: contain;
            border: 1px solid var(--ed-orange);
            box-shadow: 0 0 40px rgba(255, 113, 0, 0.2), 0 0 80px rgba(0, 0, 0, 0.8);
            display: block;
        }

        .lightbox-caption {
            margin-top: 12px;
            color: var(--ed-cyan); font-size: 0.85rem; letter-spacing: 2px; opacity: 0.7;
        }

        .lightbox-nav {
            position: fixed; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.6); border: 1px solid var(--ed-orange-dim);
            color: var(--ed-orange); font-size: 1.8rem; cursor: pointer;
            padding: 12px 16px; line-height: 1;
            transition: background 0.2s, border-color 0.2s;
            z-index: 2;
        }
        .lightbox-nav:hover { background: var(--ed-orange-dim); border-color: var(--ed-orange); }
        .lightbox-nav.prev { left: 16px; }
        .lightbox-nav.next { right: 16px; }

        .lightbox-close {
            position: fixed; top: 16px; right: 16px; z-index: 2;
            background: rgba(0,0,0,0.6); border: 1px solid var(--ed-orange-dim);
            color: var(--ed-orange); font-size: 1.2rem; cursor: pointer;
            padding: 6px 12px; letter-spacing: 1px; font-family: 'Rajdhani', sans-serif;
            font-weight: 700; text-transform: uppercase; transition: background 0.2s;
        }
        .lightbox-close:hover { background: var(--ed-orange-dim); }

        .lightbox-counter {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            color: var(--ed-cyan); font-size: 0.85rem; letter-spacing: 2px;
            background: rgba(0,0,0,0.6); padding: 4px 12px;
            border: 1px solid var(--ed-cyan-dim);
        }

        /* Responsive */
        @media (max-width: 768px) {
            body { padding: 1rem; }
            .header { flex-direction: column; align-items: flex-start; gap: 4px; }
            .header h1 { font-size: 1.5rem; letter-spacing: 1px; }
            .header > div:last-child { display: none; }
            .site-nav { width: 100%; }
            .site-nav a { padding: 8px 12px; font-size: 0.88rem; letter-spacing: 1px; flex: 1; text-align: center; }
            .panel-header { padding: 0.6rem 1rem; }
            .panel-header h2 { font-size: 1.1rem; letter-spacing: 1px; }
            .panel-content { padding: 1rem; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
            .lightbox-nav { font-size: 1.4rem; padding: 8px 12px; }
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.2rem; }
            .site-nav a { padding: 7px 8px; font-size: 0.78rem; letter-spacing: 0.5px; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="scanlines"></div>

    <div class="container">
        <header class="header">
            <div>
                <div id="gst-clock" style="color:var(--text-light);font-weight:600;font-size:1rem;letter-spacing:2px;margin-bottom:5px;opacity:0.9;">SYNCING TIME...</div>
                <h1>WASABI ORBITAL SOCIAL CLUB</h1>
                <div class="header-sub">SQUADRON GALLERY</div>
            </div>
            <div style="text-align:right;">
                <div class="header-sub" style="color:var(--ed-orange);">Welcome, CMDR!</div>
            </div>
        </header>

        <nav class="site-nav">
            <a href="/WOSC/">&#9632; DASHBOARD</a>
            <a href="/WOSC/neighborhood/">&#9670; LOCAL NEIGHBORHOOD</a>
            <a href="/WOSC/bgs-tools/">&#9670; BGS TOOLS</a>
            <a href="/WOSC/gallery/" class="active">&#9670; GALLERY</a>
        </nav>

        <section class="panel">
            <div class="panel-header">
                <h2>&#9670; SQUADRON SCREENSHOTS</h2>
                <span class="gallery-count" id="gallery-count">SCANNING...</span>
            </div>
            <div class="panel-content">
                <div id="gallery-grid" class="gallery-grid">
                    <div class="gallery-status">&#9632; INITIALISING UPLINK...</div>
                </div>
            </div>
        </section>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
        <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
        <div class="lightbox-inner">
            <img class="lightbox-img" id="lightbox-img" src="" alt="">
            <div class="lightbox-caption" id="lightbox-caption"></div>
        </div>
        <button class="lightbox-close" id="lightbox-close">&#10005; CLOSE</button>
        <button class="lightbox-nav prev" id="lightbox-prev">&#9668;</button>
        <button class="lightbox-nav next" id="lightbox-next">&#9658;</button>
        <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>

    <script>
        // ── CONFIG ──────────────────────────────────────────────────────────────
        // Set these to match your GitHub repository.
        const GITHUB_USER = 'thexant';
        const GITHUB_REPO = 'WOSC';
        // ────────────────────────────────────────────────────────────────────────

        const IMAGE_EXTS = new Set(['jpg','jpeg','png','gif','webp','avif','svg','bmp']);

        function isImage(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            return IMAGE_EXTS.has(ext);
        }

        // ── GST Clock ───────────────────────────────────────────────────────────
        function updateGSTClock() {
            const now = new Date();
            const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
            const d  = String(now.getUTCDate()).padStart(2,'0');
            const mo = months[now.getUTCMonth()];
            const y  = now.getUTCFullYear() + 1286;
            const h  = String(now.getUTCHours()).padStart(2,'0');
            const mn = String(now.getUTCMinutes()).padStart(2,'0');
            const s  = String(now.getUTCSeconds()).padStart(2,'0');
            document.getElementById('gst-clock').textContent = `${d} ${mo} ${y} // ${h}:${mn}:${s} GST`;
        }

        // ── Gallery ─────────────────────────────────────────────────────────────
        let galleryImages = [];
        let currentIndex  = 0;

        async function loadGallery() {
            const grid  = document.getElementById('gallery-grid');
            const count = document.getElementById('gallery-count');

            if (GITHUB_USER === 'YOUR_GITHUB_USERNAME') {
                grid.innerHTML = `<div class="gallery-status error">&#9888; CONFIG REQUIRED: Set GITHUB_USER in gallery/index.html</div>`;
                count.textContent = 'NOT CONFIGURED';
                return;
            }

            try {
                const url  = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/gallery`;
                const res  = await fetch(url, { headers: { Accept: 'application/vnd.github.v3+json' } });

                if (!res.ok) {
                    const msg = res.status === 404
                        ? 'GALLERY FOLDER NOT FOUND ON GITHUB'
                        : `API ERROR ${res.status}`;
                    throw new Error(msg);
                }

                const files = await res.json();
                galleryImages = files
                    .filter(f => f.type === 'file' && isImage(f.name))
                    .sort((a, b) => a.name.localeCompare(b.name));

                if (!galleryImages.length) {
                    grid.innerHTML = `<div class="gallery-status">NO IMAGES FOUND — ADD IMAGE FILES TO THE GALLERY FOLDER AND PUSH TO GITHUB</div>`;
                    count.textContent = '0 IMAGES';
                    return;
                }

                count.textContent = `${galleryImages.length} IMAGE${galleryImages.length !== 1 ? 'S' : ''}`;

                grid.innerHTML = galleryImages.map((img, i) => `
                    <div class="gallery-item" onclick="openLightbox(${i})" role="button" tabindex="0"
                         onkeydown="if(event.key==='Enter'||event.key===' ')openLightbox(${i})">
                        <img src="${img.download_url}" alt="${img.name}" loading="lazy">
                        <div class="gallery-item-label">${img.name}</div>
                    </div>`).join('');

            } catch (err) {
                grid.innerHTML = `<div class="gallery-status error">&#9888; UPLINK FAILED: ${err.message}</div>`;
                count.textContent = 'UPLINK FAILED';
            }
        }

        // ── Lightbox ────────────────────────────────────────────────────────────
        function openLightbox(index) {
            currentIndex = index;
            showImage(currentIndex);
            document.getElementById('lightbox').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('open');
            document.body.style.overflow = '';
        }

        function showImage(index) {
            const img     = galleryImages[index];
            const el      = document.getElementById('lightbox-img');
            el.src        = img.download_url;
            el.alt        = img.name;
            document.getElementById('lightbox-caption').textContent  = img.name;
            document.getElementById('lightbox-counter').textContent  = `${index + 1} / ${galleryImages.length}`;
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
            showImage(currentIndex);
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % galleryImages.length;
            showImage(currentIndex);
        }

        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        document.getElementById('lightbox-backdrop').addEventListener('click', closeLightbox);
        document.getElementById('lightbox-prev').addEventListener('click', (e) => { e.stopPropagation(); prevImage(); });
        document.getElementById('lightbox-next').addEventListener('click', (e) => { e.stopPropagation(); nextImage(); });

        document.addEventListener('keydown', e => {
            if (!document.getElementById('lightbox').classList.contains('open')) return;
            if (e.key === 'Escape')      closeLightbox();
            else if (e.key === 'ArrowLeft')  prevImage();
            else if (e.key === 'ArrowRight') nextImage();
        });

        // ── Init ────────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            updateGSTClock();
            setInterval(updateGSTClock, 1000);
            loadGallery();
        });
    </script>
</body>
</html>
